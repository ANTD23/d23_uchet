<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1F23">
<meta name="color-scheme" content="light dark">
<title>Club D23 — учёт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23143C30'/><text x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>D23</text></svg>">
<style>
/* ===== Club D23 — дизайн-система (октябрь 2026) =====
   Цвета: графит + изумрудные кнопки; тёмная тема — «Лёд туман» (мягкий монохром, светлые кнопки). Все цвета — переменные; тёмная тема переопределяет только их.
   Тема: по настройке системы, или вручную — «Настройки» → «Оформление» (атрибут data-theme на <html>). */
:root{
  /* бренд и акцент */
  --brand:#1C1F23; --brand-ink:#B6BEC6;            /* боковое меню, нижняя панель */
  --logo:#143C30;                                   /* иконка клуба — фирменный зелёный */
  --accent:#22262B; --accent-soft:#ECEEF1;          /* выбранное, крупные цифры */
  --accent-btn:#1A7A58; --accent-btn-ink:#FFFFFF;   /* главные кнопки — изумруд */
  --accent-btn-2:#2FA77A; --accent-btn-deep:#145F45; --tab-mark:#7FD7B0;   /* полоса и плитка ближайшего турнира, метка вкладки */
  /* нейтральные */
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F8F9FA; --sunk:#ECEEF1; --line:#DDE1E5; --line-strong:#C5CBD1;
  --ink:#15181B; --ink-2:#4A525A; --ink-3:#5F6871;
  /* смысловые: текст / фон / заливка под белым текстом */
  --ok:#1F6B3F;   --ok-bg:#E2F2E8;   --ok-fill:#23804B;   --next-ring:#D9730D; --warned-nm:#1F5FBF;   /* кольцо «следующий абонемент оплачен» */
  --warn:#8A4B00; --warn-bg:#FCEFD9; --warn-fill:#C77A12;
  --bad:#A4221A;  --bad-bg:#FCE6E3;  --bad-fill:#B3261E;
  --sick:#1D58A3; --sick-bg:#E3EDF9; --sick-fill:#1F5FAE;   /* синий клуба: болел, заморозка */
  --comp:#6A43A3; --comp-bg:#EFE8F8; --comp-fill:#6E48A6;   /* соревнования */
  --cancel:#5F6964; --cancel-fill:#5F6964;
  --hl2:#6E5303;  --hl2-bg:#FFF6D2;  --hl2-fill:#D9AE1F;    /* «осталось 2» */
  --on-fill:#FFFFFF;
  --chip-ok-bg:#E3E6EA; --chip-ok-ink:#15181B; --chip-ok-mark:#23804B;   /* «действует», «ост. N»: серый, чёрные цифры */
  --gold:#C99A06; --silver:#8E98A3; --bronze:#B06A2E;              /* места на турнирах: полоса и бейдж */
  --belt-edge:rgba(0,0,0,.28);                      /* окантовка пояса: на светлом — тёмная */
  --shadow-1:0 1px 2px rgba(16,24,32,.06),0 1px 1px rgba(16,24,32,.04);
  --shadow-2:0 12px 32px rgba(16,24,32,.18);
  --focus:#1D58A3;
  /* прежние имена — для разметки, которая на них ссылается */
  --muted:var(--ink-2); --primary:var(--accent-btn); --primary-ink:var(--accent-btn-ink); --nav:var(--brand); --nav-ink:var(--brand-ink);
  /* размеры */
  --r:12px; --r-s:8px; --r-pill:999px; --tap:44px; --dur:160ms;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
/* 23.10.2026: тёмная тема «Сталь» (как в «Железном дневнике»): сталь, жёлтые кнопки цвета блина; прежняя тёмная — «Тёмная мягкая» (data-theme="soft") */
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="soft"]){
  --brand:#0C0E11; --brand-ink:#99A1AC; --accent:#EEF0F3; --accent-soft:#3A3013; --accent-btn:#F2C230; --accent-btn-ink:#1D1500;
  --accent-btn-2:#D9A81C; --accent-btn-deep:#B8860B; --tab-mark:#F2C230;
  --bg:#101216; --surface:#191C21; --surface-2:#1F2329; --sunk:#0C0E11; --line:#2C3139; --line-strong:#3E444E;
  --ink:#EEF0F3; --ink-2:#99A1AC; --ink-3:#8C949F;
  --ok:#4CC47F; --ok-bg:#15301F; --ok-fill:#1F8148; --next-ring:#F2A03A; --warned-nm:#8FB3FF;
  --warn:#F2C230; --warn-bg:#3A3013; --warn-fill:#B8860B;
  --bad:#FF6B6B; --bad-bg:#3A1C1C; --bad-fill:#C43A3A;
  --sick:#8FB3FF; --sick-bg:#1C2740; --sick-fill:#2F5FB8;
  --comp:#C6B0FF; --comp-bg:#2A2340; --comp-fill:#6F57AE;
  --cancel:#A9AEB6; --cancel-fill:#5E636C;
  --hl2:#F2C230; --hl2-bg:#3A3013; --hl2-fill:#B8860B; --gold:#F2C230; --silver:#C4C9D0; --bronze:#D08A52; --belt-edge:rgba(255,255,255,.34); --chip-ok-bg:#242830; --chip-ok-ink:#EEF0F3; --chip-ok-mark:#4CC47F;
  --shadow-1:none; --shadow-2:0 16px 40px rgba(0,0,0,.6); --focus:#F2C230;
  color-scheme:dark}}
@media screen{:root[data-theme="dark"]{
  --brand:#0C0E11; --brand-ink:#99A1AC; --accent:#EEF0F3; --accent-soft:#3A3013; --accent-btn:#F2C230; --accent-btn-ink:#1D1500;
  --accent-btn-2:#D9A81C; --accent-btn-deep:#B8860B; --tab-mark:#F2C230;
  --bg:#101216; --surface:#191C21; --surface-2:#1F2329; --sunk:#0C0E11; --line:#2C3139; --line-strong:#3E444E;
  --ink:#EEF0F3; --ink-2:#99A1AC; --ink-3:#8C949F;
  --ok:#4CC47F; --ok-bg:#15301F; --ok-fill:#1F8148; --next-ring:#F2A03A; --warned-nm:#8FB3FF;
  --warn:#F2C230; --warn-bg:#3A3013; --warn-fill:#B8860B;
  --bad:#FF6B6B; --bad-bg:#3A1C1C; --bad-fill:#C43A3A;
  --sick:#8FB3FF; --sick-bg:#1C2740; --sick-fill:#2F5FB8;
  --comp:#C6B0FF; --comp-bg:#2A2340; --comp-fill:#6F57AE;
  --cancel:#A9AEB6; --cancel-fill:#5E636C;
  --hl2:#F2C230; --hl2-bg:#3A3013; --hl2-fill:#B8860B; --gold:#F2C230; --silver:#C4C9D0; --bronze:#D08A52; --belt-edge:rgba(255,255,255,.34); --chip-ok-bg:#242830; --chip-ok-ink:#EEF0F3; --chip-ok-mark:#4CC47F;
  --shadow-1:none; --shadow-2:0 16px 40px rgba(0,0,0,.6); --focus:#F2C230;
  color-scheme:dark}}
/* 25.10.2026: «Чёрная» — для AMOLED-экранов: фон чисто чёрный (пиксели выключены — экономия батареи), карточки чуть светлее, жёлтые кнопки как у «Тёмной» */
@media screen{:root[data-theme="amoled"]{
  --brand:#000000; --brand-ink:#8E959F; --accent:#EEF0F3; --accent-soft:#2A2310; --accent-btn:#F2C230; --accent-btn-ink:#1D1500;
  --accent-btn-2:#D9A81C; --accent-btn-deep:#B8860B; --tab-mark:#F2C230;
  --bg:#000000; --surface:#0B0C0E; --surface-2:#111316; --sunk:#000000; --line:#1F2228; --line-strong:#30343C;
  --ink:#E9EBEE; --ink-2:#959CA6; --ink-3:#868D97;
  --ok:#4CC47F; --ok-bg:#0E2216; --ok-fill:#1D7A44; --next-ring:#F2A03A; --warned-nm:#8FB3FF;
  --warn:#F2C230; --warn-bg:#2A2310; --warn-fill:#B8860B;
  --bad:#FF6B6B; --bad-bg:#2A1212; --bad-fill:#C43A3A;
  --sick:#8FB3FF; --sick-bg:#121B30; --sick-fill:#2F5FB8;
  --comp:#C6B0FF; --comp-bg:#1D1830; --comp-fill:#6F57AE;
  --cancel:#A9AEB6; --cancel-fill:#4E535B;
  --hl2:#F2C230; --hl2-bg:#2A2310; --hl2-fill:#B8860B; --gold:#F2C230; --silver:#C4C9D0; --bronze:#D08A52; --belt-edge:rgba(255,255,255,.34); --chip-ok-bg:#16181C; --chip-ok-ink:#E9EBEE; --chip-ok-mark:#4CC47F;
  --shadow-1:none; --shadow-2:0 16px 40px rgba(0,0,0,.8); --focus:#F2C230;
  color-scheme:dark}}
@media screen{:root[data-theme="soft"]{
  --brand:#16171A; --brand-ink:#A4AAB2; --accent:#D4D8DD; --accent-soft:#32363C; --accent-btn:#C3C8CF; --accent-btn-ink:#1A1C1F;
  --accent-btn-2:#878E98; --accent-btn-deep:#A9AFB8; --tab-mark:#C3C8CF;
  --bg:#1C1E21; --surface:#24272B; --surface-2:#2A2D32; --sunk:#16181A; --line:#363A41; --line-strong:#4A4F57;
  --ink:#D4D8DD; --ink-2:#A3A9B1; --ink-3:#9399A2;
  --ok:#8CCBA4; --ok-bg:#22322A; --ok-fill:#33764F; --next-ring:#F0A04B; --warned-nm:#7FB2FF;
  --warn:#DDBA7A; --warn-bg:#383124; --warn-fill:#B58224;
  --bad:#E8A49E; --bad-bg:#3D2B2C; --bad-fill:#AD4A43;
  --sick:#A2BFE2; --sick-bg:#252D3D; --sick-fill:#3F69AE;
  --comp:#C2B1E2; --comp-bg:#2F2C42; --comp-fill:#6F57AE;
  --cancel:#A9AEB6; --cancel-fill:#5E636C;
  --hl2:#DDCB8E; --hl2-bg:#353022; --hl2-fill:#B5952B; --gold:#E2B93B; --silver:#B7C0CA; --bronze:#D08A52; --belt-edge:rgba(255,255,255,.34); --chip-ok-bg:#30343A; --chip-ok-ink:#D4D8DD; --chip-ok-mark:#8CCBA4;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 16px 40px rgba(0,0,0,.45); --focus:#C3C8CF;
  color-scheme:dark}}
@media print{:root,:root[data-theme="dark"],:root[data-theme="soft"],:root[data-theme="amoled"]{   /* печать — всегда светлая палитра */
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --sunk:#FFFFFF; --line:#999999; --line-strong:#666666;
  --ink:#000000; --ink-2:#000000; --ink-3:#000000; color-scheme:light}}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sick)} a[href^="tel"]{white-space:nowrap}
details.filt > summary{cursor:pointer;font-weight:600;margin:4px 0 8px;min-height:var(--tap);display:flex;align-items:center}
.num{font-variant-numeric:tabular-nums}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 .25rem;letter-spacing:-.01em}
h2{font-size:1.25rem;line-height:1.3;margin:0 0 .75rem}
h3{font-size:1.0625rem;margin:0 0 .5rem}
.muted{color:var(--ink-2)} .small{font-size:.875rem}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.btn,.mk,.nav a,.tabbar a,.seg button{transition:background-color var(--dur),border-color var(--dur),color var(--dur)}}

/* каркас */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand b{font-size:1.125rem;color:#fff;letter-spacing:.01em}
.brand span{font-size:.8125rem;opacity:.8;display:block}
.mark-logo{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--logo);display:grid;place-items:center;font-weight:800;font-size:.875rem;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:0 10px;border-radius:var(--r-s);color:var(--brand-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.13);color:#fff;font-weight:650}
.nav a.nav-search{background:rgba(255,255,255,.08);margin-bottom:8px;font-size:.9375rem}
.nav a.nav-search kbd{margin-left:auto;font:600 .75rem ui-monospace,Consolas,monospace;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 6px}
.nav .nav-gl{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:14px 10px 6px;color:#8E98A2}
.nav svg{width:20px;height:20px;flex:none}
.side .sync{margin-top:auto;font-size:.875rem;padding:12px;border-radius:var(--r-s);background:rgba(255,255,255,.07)}
.side .sync button{margin-top:8px;width:100%}
main{padding:24px 32px 96px;max-width:1180px;width:100%;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabbar,.mtop{display:none}

/* элементы */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.card.flat{padding:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-s);padding:0 16px;cursor:pointer;white-space:nowrap;min-height:var(--tap);text-decoration:none;color:var(--ink);font-weight:600;font-size:.9375rem}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--accent-btn-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent-btn)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:0 12px;min-height:36px;font-size:.875rem}
@media (pointer:coarse){.btn.sm{min-height:var(--tap);font-size:.9375rem}}
.btn:disabled{opacity:.5;cursor:default}
.side .btn{background:#fff;color:#1C1F23;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--r-pill);font-size:.875rem;font-weight:600;line-height:1.45;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.nb{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px} .nb .chip{font-size:.8125rem;padding:1px 8px;cursor:help}
.chip.ok{background:var(--chip-ok-bg);color:var(--chip-ok-ink);font-weight:700;box-shadow:none} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.sick{background:var(--sick-bg);color:var(--sick)}
.chip.muted{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.chip.ok::before{content:"✓";font-weight:800;color:var(--chip-ok-mark)}
.chip.bad::before{content:"!";font-weight:800}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=search],input[type=password],input[type=month],input[type=email],select,textarea{border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 12px;background:var(--surface);color:var(--ink);min-height:var(--tap);width:100%;font-size:1rem}
input.srch-b{border-width:2px;border-color:var(--ink);font-weight:700}input.srch-b::placeholder{font-weight:700;color:var(--ink);opacity:.75}
input:focus,select:focus,textarea:focus{border-color:var(--accent-btn);outline:3px solid rgba(26,122,88,.25);outline-offset:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent-btn)}
textarea{min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.875rem;color:var(--ink-2)}
label.f > span{font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.fgrid .wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:0 0 12px}
legend{padding:0 6px;font-weight:600;font-size:.9375rem}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;background:var(--sunk);border-radius:var(--r);padding:4px;gap:4px;border:0;scrollbar-width:none} .seg::-webkit-scrollbar{display:none}
/* 23.10.2026: вкладки не помещаются — край затухает и видна стрелка: можно листать */
.seg.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.seg.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px);mask-image:linear-gradient(90deg,transparent,#000 44px)}
.seg.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.seg-wrap{position:relative;display:inline-block;max-width:100%} .seg-arr{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:none;place-items:center;font-size:1.1rem;line-height:1;cursor:pointer;z-index:2;box-shadow:var(--shadow-1);padding:0}
.seg-arr.r{right:2px} .seg-arr.l{left:2px}
.tx-wrap{position:relative} .tx-wrap .seg-arr.tx{top:22px;transform:none} .tx-wrap.more-r .seg-arr.tx.r,.tx-wrap.more-l .seg-arr.tx.l{display:grid}
.tail-x.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.tail-x.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px);mask-image:linear-gradient(90deg,transparent,#000 48px)}
.tail-x.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
@media print{.tail-x{-webkit-mask-image:none!important;mask-image:none!important}} .seg-wrap.more-r .seg-arr.r,.seg-wrap.more-l .seg-arr.l{display:grid}
.seg button{flex:none;border:0;background:transparent;padding:0 14px;cursor:pointer;min-height:38px;border-radius:var(--r-s);font-weight:600;font-size:.9375rem;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2)}

/* списки */
.list{list-style:none;margin:0;padding:0}
.list > li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:52px}
.list > li:first-child{border-top:0}
.list > li.click{cursor:pointer}
.list > li.click:hover{background:var(--surface-2)}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .small{display:block;color:var(--ink-2)}
table.t{width:100%;border-collapse:collapse;font-size:.9375rem}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);font-size:.875rem;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th.sortable{cursor:pointer;user-select:none;white-space:nowrap} table.t th.sortable:hover{color:var(--ink)} table.t th.sorted{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}

/* подсветка остатка в абонементах: цвет + полоса слева; слово — в бейдже строки */
table.t tr.rem1 td{background:var(--warn-bg)} table.t tr.rem1 td:first-child{box-shadow:inset 5px 0 0 var(--warn-fill)}
table.t tr.rem1 .nm{color:var(--warn)}
table.t tr.rem2 td{background:var(--hl2-bg)} table.t tr.rem2 td:first-child{box-shadow:inset 5px 0 0 var(--hl2-fill)}
table.t tr.rem2 .nm{color:var(--hl2)}

.fz-list{border-bottom:1px solid var(--line)} .fin-sec{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:20px 4px 8px} .fin-sec:first-child{margin-top:4px} table.fin-kv td{padding:5px 8px;border-bottom:1px solid var(--line)} table.fin-kv{width:100%} .fz-sub{font-size:.78rem;font-weight:600;color:var(--ink-2);margin:10px 4px 4px} .fz-sub .muted{font-weight:400}

.plan-sec{overflow:hidden} .plan-in{display:flex;flex-direction:column;gap:12px;padding:4px 12px 12px} .plan-in .plan-sec{border:1px solid var(--line);border-radius:var(--r)} .plan-h{padding:12px 16px;font-weight:700;font-size:1.0625rem;background:var(--surface-2);border-bottom:1px solid var(--line);border-left:5px solid var(--line-strong)}

ul.plan{list-style:none;margin:0;padding:0} .pl{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);border-left:5px solid transparent}

const DC = { add: new Map(), dow: new Map() };      // ускорение: уже посчитанные даты (результат не меняется — те же функции)
const D = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  fmt(dt) { return dt.toISOString().slice(0, 10); },

  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); }, // b − a, дней

  short(s) { if (!s) return ''; const [, m, d] = s.split('-'); return d + '.' + m; },
  leap(y) { return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); },
  lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },  // последний день месяца m (1–12)
  age(birth, at) {                                                   // полных лет на дату at (день рождения включительно)

function buildIndex(db, today) {
  const S = db.settings;
  const ix = {
    today, db,
    group: new Map(S.groups.map(g => [g.name, g])),
    holiday: new Map(S.holidays.map(h => [h.date, h.reason])),
    ath: new Map(db.athletes.map(a => [a.id, a])),
    marks: new Map(),          // athleteId → [{date, group, mark, sid}] по дате
    groupDates: new Map(),     // группа → [даты занятий] по дате
    subsByAth: new Map(),
    awardsByAth: new Map(),
    freezesByAth: new Map(),
    sessionsSorted: [...db.sessions].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0),
  };
  for (const s of ix.sessionsSorted) {
    if (Object.values(s.marks || {}).some(Boolean)) {            // пустое (открытое по ошибке) занятие не сдвигает прогноз
      if (!ix.groupDates.has(s.group)) ix.groupDates.set(s.group, []);
      ix.groupDates.get(s.group).push(s.date);
    }
    for (const [aid, m] of Object.entries(s.marks || {})) {
      if (!m) continue;
      if (!ix.marks.has(aid)) ix.marks.set(aid, []);
      ix.marks.get(aid).push({ date: s.date, group: s.group, mark: m, sid: s.id, trial: !!(s.trial && s.trial[aid]), trialV: (s.trial && s.trial[aid]) || '' });
    }
  }
  const push = (map, k, v) => { if (!map.has(k)) map.set(k, []); map.get(k).push(v); };
  for (const p of db.subs) push(ix.subsByAth, p.athleteId, p);
  for (const w of db.awards) push(ix.awardsByAth, w.athleteId, w);
  for (const f of db.freezes) push(ix.freezesByAth, f.athleteId, f);
  for (const l of ix.subsByAth.values()) l.sort((a, b) => subKey(a).localeCompare(subKey(b)) || db.subs.indexOf(a) - db.subs.indexOf(b));
  for (const l of ix.awardsByAth.values()) l.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  computeSubs(ix);
  ix.athCalc = new Map();
  for (const a of db.athletes) ix.athCalc.set(a.id, calcAthlete(ix, a));
  return ix;
}

function daysOn(G, date) {                       // расписание группы на дату (№15: с историей изменений)
  const hist = G && G.schedHistory;

  let r = hist[0].days;
  for (const e of hist) { if (!e.from || e.from <= date) r = e.days; else break; }
  return r;
}

function personSummary(a, c, freezes) {
  const L = [], s = c.subCalc, left = a.status === 'ушёл';
  if (left) L.push(['Договор', '<b>прекращён' + (leftDate(a) ? ' ' + D.ru(leftDate(a)) : '') + '</b>' + (a.refund ? ' · отказ от договора ' + D.ru(a.refund.date) : '')]);
  if (s && s.terminated) L.push(['Абонемент', 'договор прекращён ' + D.ru(s.terminated)]);
  else if (c.pendingSub) { const e = notifyState(c.pendingSub, 'end');
    L.push(['Абонемент', '<b style="color:var(--bad)">ждём оплату</b>' + (c.pendingCalc && c.pendingCalc.charged ? ', в долг ' + c.pendingCalc.charged + ' зан.' : '') + (e ? ' · <span class="warned">✉ предупреждён ' + D.ru(e.at) + '</span>' : '')]); }
  else if (s) {
    if (s.notActive) L.push(['Абонемент', 'оплачен, не активирован' + (s.autoDate ? ' (автоактивация ' + D.ru(s.autoDate) + ')' : '')]);
    else if (s.remaining < 0) L.push(['Абонемент', '<b style="color:var(--bad)">долг ' + (-s.remaining) + ' зан.</b>']);
    else L.push([s.pkg ? 'Пакет разовых' : 'Абонемент', (s.remaining === 0 ? 'использован' : 'осталось <b>' + s.remaining + '</b> ' + plural(s.remaining, 'занятие', 'занятия', 'занятий') + (s.pkg ? ' из ' + subTotal(c.sub) + ', без срока' : '')) + (s.end ? (s.endKind === 'fact' ? ', последнее ' : ', до ') + D.ru(s.end) : '') + (extNote(s) ? `<div class="small" style="font-weight:500;color:var(--ink-2)">Срок ${h(extNote(s))}</div>` : '') + (s.provSick && s.certEnd ? ` <span class="chip sick" title="Пока справки нет, занятия болезни (${s.provDates.map(d => D.short(d)).join(', ')}) списываются. Справка внесена — срок продлится">${certHint(s)}</span>` : '')]);
    if (!left && !s.notActive && (+c.sub.count || 0) > 1) {          // ушёл — сообщать о сроке и окончании уже некому
      const q = notifyState(c.sub, 'period'), e = notifyState(c.sub, 'end'), sid = c.sub.id;
      const btns = (ty, tpl) => `<span class="row no-print" style="gap:6px;margin-top:4px"><button class="btn sm" data-act="msg" data-id="${a.id}" data-sub="${sid}" data-tpl="${tpl}">Написать</button><button class="btn sm ghost" data-act="notify-mark" data-sub="${sid}" data-type="${ty}" title="Сообщение отправлено не из программы">Уже отправил</button></span>`;
      if (!s.pkg && (q || s.first >= (db.settings.notifyFrom || '9999'))) L.push(['Срок сообщён', q ? '✓ ' + D.ru(q.at) + (q.stale ? ` <span class="chip warn">срок изменился: теперь до ${D.ru(q.now)}</span>` + btns('period', 'Абонемент продлён') : '')
        : (s.first >= (db.settings.notifyFrom || '9999') ? '<span class="muted">не отмечено</span>' + btns('period', 'Новый абонемент оплачен') : '<span class="muted">—</span>')]);
      if (e || (s.remaining <= (s.pkg ? 1 : 2) && !c.nextSub)) L.push(['Об окончании', e ? '✓ предупреждён ' + D.ru(e.at) + (e.stale && !s.pkg ? ` <span class="chip warn">окончание изменилось: теперь ${D.ru(e.now)}</span>` + btns('end', 'Абонемент заканчивается') : '')
        : '<b style="color:var(--bad)">не предупреждён</b>' + btns('end', s.pkg ? (s.remaining === 0 ? 'Пакет разовых использован' : 'Пакет разовых заканчивается') : s.remaining === 0 ? 'Абонемент закончился' : 'Абонемент заканчивается')]);
    }
    if (c.nextSub) { const nr = ix.subCalc.get(c.nextSub.id); L.push(['Следующий', 'оплачен' + (nr && nr.first ? ', с ' + D.ru(nr.first) : '')]); }
  } else L.push(['Абонемент', a.noSub ? 'без абонемента' : a.payPerVisit ? 'оплата разово' : '<span class="muted">нет</span>']);
  if ((c.debtDates || []).length && !c.pendingSub) L.push(['Не оплачено', '<b style="color:var(--bad)">' + c.debtDates.map(d => D.short(d)).join(', ') + '</b>']);
  for (const f of freezes) { const fc = calcFreeze(ix, f);
    if (fc.certAsk) L.push(['Заморозка', `<b style="color:var(--bad)">спросить справку на занятии ${D.ru(fc.askBy)}</b>`]);
    else if (fc.mode === 'wait') L.push(['Заморозка', freezeState(fc, f) + ': болеет с ' + D.ru(f.from) + ', ждём возвращения до ' + D.ru(fc.returnBy)]);
    else if (fc.mode === 'prov') L.push(['Заморозка', 'предварительно: болеет с ' + D.ru(f.from) + ', дата «по» не внесена']);
    else if (fc.mode === 'err' || fc.mode === 'incomplete') L.push(['Заморозка', '<b style="color:var(--bad)">ошибка: ' + h(fc.text) + '</b>']); }
  if (c.med === 'просрочена') L.push(['Медсправка', '<b style="color:var(--bad)">просрочена</b>']); else if (c.med === 'истекает') L.push(['Медсправка', 'до ' + D.ru(a.medUntil)]);
  if (a.status === 'занимается') {
    { const g = noSubGap(a); if (g && g.ack) L.push(['Отметки', `не спрашиваются с ${D.ru(g.ack)}: абонемент закончился ${D.ru(g.end)}, «Не был» <button class="btn sm no-print" data-act="nosub-undo" data-id="${a.id}">Снова спрашивать отметки</button>`]); }   // №34
    const nd = briefNeed(a, ix.today); if (nd) L.push(['Инструктаж', '<b style="color:var(--bad)">нужен ' + nd.kind + '</b>']);
    const k = a.docs || {};
    if (!Object.values(k).some(Boolean) && !a.healthConsent) L.push(['Документы', '<span class="muted">не отмечены</span>']);
    else { const miss = docsMissing(a, c); if (miss.length) L.push(['Не хватает', miss.join(', ')]); }
  }
  return `<div class="card sec-keep psum" style="padding-top:12px;padding-bottom:12px"><dl class="kv">${L.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
}
/* 23.10.2026: длинные пояснения (серый текст) свёрнуты в «ⓘ Пояснение»; абзацы с данными (class="keep") и окна — не сворачиваются */
function foldHints() {
  const main = document.querySelector('main'); if (!main) return;
  ui.hintOpen = ui.hintOpen || new Set();
  for (const p of main.querySelectorAll('p.small.muted:not(.keep)')) {
    if (p.dataset.fold || p.closest('.print-only')) continue;
    const t = p.textContent.trim(); if (t.length < 110) continue;
    const k = t.slice(0, 60), open = ui.hintOpen.has(k); p.dataset.fold = '1';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'hint-b no-print'; b.textContent = 'ⓘ Пояснение'; b.setAttribute('aria-expanded', open);
    p.classList.add('hint-p'); if (!open) p.classList.add('hint-closed');
    b.onclick = () => { const on = !p.classList.toggle('hint-closed'); b.setAttribute('aria-expanded', on); b.textContent = on ? 'ⓘ Скрыть пояснение' : 'ⓘ Пояснение'; if (on) ui.hintOpen.add(k); else ui.hintOpen.delete(k); };
    if (open) b.textContent = 'ⓘ Скрыть пояснение';
    p.before(b);
  }
}
/* 23.10.2026: таблица шире экрана (.tail-x) — затухание края и стрелки ‹ › ; листать можно и пальцем */
function tableTails() {
  document.querySelectorAll('main .tail-x').forEach(sc => {
    let w = sc.parentElement;
    if (!w.classList.contains('tx-wrap')) { w = document.createElement('div'); w.className = 'tx-wrap'; sc.before(w); w.append(sc);
      const mk = (cl, t, dx) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'seg-arr tx ' + cl + ' no-print'; b.textContent = t; b.setAttribute('aria-label', cl === 'r' ? 'Прокрутить вправо' : 'Прокрутить влево');
        b.onclick = e => { e.stopPropagation(); sc.scrollBy({ left: dx * sc.clientWidth * 0.7, behavior: 'smooth' }); }; w.append(b); };
      mk('l', '‹', -1); mk('r', '›', 1); }
    const upd = () => { const r = sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 4, l = sc.scrollLeft > 4; sc.classList.toggle('more-r', r); sc.classList.toggle('more-l', l); w.classList.toggle('more-r', r); w.classList.toggle('more-l', l); };
    if (!sc.dataset.tail) { sc.dataset.tail = '1'; sc.addEventListener('scroll', upd, { passive: true }); } upd();
  });
}
function segTails() {                             // 23.10.2026: вкладки шире экрана — затухание и стрелки ‹ › ; выбранная вкладка — в видимой части
  document.querySelectorAll('main .seg:not(.full)').forEach(sg => {
    if (sg.scrollWidth <= sg.clientWidth + 4) return;
    let w = sg.parentElement; if (!w.classList.contains('seg-wrap')) { w = document.createElement('div'); w.className = 'seg-wrap no-print'; sg.before(w); w.append(sg);
      const mk = (cl, t, dx) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'seg-arr ' + cl; b.textContent = t; b.setAttribute('aria-label', cl === 'r' ? 'Дальше' : 'Назад'); b.onclick = () => sg.scrollBy({ left: dx * sg.clientWidth * 0.7, behavior: 'smooth' }); w.append(b); };
      mk('l', '‹', -1); mk('r', '›', 1); }
    const upd = () => { const r = sg.scrollLeft + sg.clientWidth < sg.scrollWidth - 4, l = sg.scrollLeft > 4; sg.classList.toggle('more-r', r); sg.classList.toggle('more-l', l); w.classList.toggle('more-r', r); w.classList.toggle('more-l', l); };
    const on = sg.querySelector('.on'); if (on) { const x = on.offsetLeft - sg.offsetLeft; if (x + on.offsetWidth > sg.scrollLeft + sg.clientWidth || x < sg.scrollLeft) sg.scrollLeft = Math.max(0, x - 24); }
    if (!sg.dataset.tail) { sg.dataset.tail = '1'; sg.addEventListener('scroll', upd, { passive: true }); } upd();
  });
}

  if (e) b.push(`<span class="chip ${e.stale ? 'warn' : 'ok'}" title="${e.stale ? 'Предупреждён об окончании ' + D.ru(e.at) + ', потом окончание изменилось — теперь ' + D.ru(e.now) : 'Предупреждён об окончании ' + D.ru(e.at)}">✉ ${e.stale ? 'окончание изменилось' : D.short(e.at)}</span>`);

  return b.length ? `<div class="nb">${b.join('')}</div>` : '';

function openTransfer(aid) {
  const a = ix.ath.get(aid), G = db.settings.groups.map(g => g.name);
  const body = `<p><b>${h(fullName(a))}</b> · сейчас: ${h(a.group || 'без группы')}</p><div class="fgrid">

  <p class="small muted">Занятия до этой даты останутся в прежней группе, с этой даты человек в новой. На абонементы перевод не влияет: посещения считаются по человеку. Если в карточке группа уже поменяна вручную, укажите в поле «Из группы» прежнюю.</p>`;
  modal('Перевод в другую группу', body, { submit: 'Перевести', onSubmit(fd) {
    if (!fd.to) { notice('Выберите новую группу'); return false; }
    if (fd.from === fd.to) { notice('Группы «из» и «в» совпадают'); return false; }
    const t = db.athletes.find(x => x.id === aid);
    t.transfers = t.transfers || [];
    if (t.transfers.some(x => x.date === fd.date && x.to === fd.to)) { notice('Такой перевод уже записан: с ' + D.ru(fd.date) + ' в «' + fd.to + '».'); return false; }
    t.transfers.push({ id: uid('g'), date: fd.date, from: fd.from, to: fd.to });
    const last = [...t.transfers].sort((x, y) => x.date.localeCompare(y.date)).pop();
    t.group = last.to;
    persist('Переведён в «' + fd.to + '» с ' + D.ru(fd.date));
  } });
}

function reportSummary(R) {
  const S = db.settings, inP = d => d && d >= R.from && d <= R.to;
  const pStart = S.programStart || S.sickCheckFrom || '';
  const active = db.athletes.filter(a => a.status === 'занимается');
  const adults = active.filter(a => { const x = ix.athCalc.get(a.id).age; return x != null && x >= 18; }).length, target = +S.adultTarget || 0;
  const newcomers = db.athletes.filter(a => inP(a.addedAt) && a.addedAt >= pStart);
  const paidNew = newcomers.filter(a => (ix.subsByAth.get(a.id) || []).some(p => !p.pending && (+p.count || 0) > 1)).length;
  let ended = 0, renewed = 0;
  for (const a of db.athletes) {
    const L = (ix.subsByAth.get(a.id) || []).filter(p => (+p.count || 0) > 1);
    L.forEach((p, i) => { const r = ix.subCalc.get(p.id); if (p.pending || !r || r.remaining > 0 || !inP(r.end) || r.end < pStart) return;
      ended++; if (L.slice(i + 1).some(q => !q.pending)) renewed++; });
  }
  const left = db.athletes.filter(a => a.status === 'ушёл' && inP(a.endedAt)).length;
  const pct = (x, y) => y ? Math.round(x / y * 100) + '%' : '—';
  const trials = db.athletes.map(a => ({ a, d: ((ix.marks.get(a.id) || []).find(m => m.trial) || {}).date })).filter(x => inP(x.d));
  const trialPaid = trials.filter(x => (ix.subsByAth.get(x.a.id) || []).some(p => !p.pending && (+p.count || 0) > 1 && subKey(p) >= x.d)).length;
  return `<div class="card"><h2>Итоги периода</h2><div class="stats">
  <div class="stat"><b>${adults}${target ? ' / ' + target : ''}</b><span class="small muted">взрослых (18+) занимается${target ? ', цель' : ''}</span></div>
  <div class="stat"><b>${newcomers.length}</b><span class="small muted">новых, из них купили абонемент ${paidNew} (${pct(paidNew, newcomers.length)})</span></div>

  <div class="stat"><b>${trialPaid} из ${trials.length}</b><span class="small muted">после пробного купили абонемент (${pct(trialPaid, trials.length)})</span></div></div>

}

/* ---------- ДЕНЬГИ ---------- */
const rub = v => (Math.round(+v || 0)).toLocaleString('ru') + ' ₽';
const rubN = v => (Math.round(+v || 0)).toLocaleString('ru');
function finItems() { if (finItems.ix !== ix) { finItems.ix = ix; finItems.v = moneyItems(db); } return finItems.v; }
function accName(id) { const A = finS(db).accounts.find(x => x.id === id); return A ? A.name : id ? 'счёт удалён' : 'не указано'; }
function coachName(id) { const c = finS(db).coaches.find(x => x.id === id); return c ? c.name : 'тренер удалён'; }
function mLoc(ym) { const m = MONTHS[+ym.slice(5) - 1]; return m === 'май' ? 'мае' : m.replace(/ь$/, 'е').replace(/т$/, 'те'); }   // «в октябре», «в марте», «в мае»
function ymRu(ym) { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; }
function itemWho(x) { const a = x.aid && ix.ath.get(x.aid); return a ? shortName(a) : ''; }
function itemText(x) {
  const c = x.kind === 'move' ? { name: 'Перевод: ' + accName(x.acc) + ' → ' + accName(x.to) } : x.kind === 'refund' ? { name: 'Возврат при отказе' } : finCat(db, x.kind, x.cat);
  const who = itemWho(x);
  return { title: c.name + (x.cat === 'salary' && x.coach ? ' — ' + coachName(x.coach) : '') + (x.period && (x.cat === 'salary' || x.cat === 'tax') ? ' за ' + ymRu(x.period) : ''),
    sub: [who, x.src === 'sub' && x.group ? x.group : '', x.note, x.anon ? 'без имени' : ''].filter(Boolean).join(' · ') };
}
function moneyRows(from, to) {                      // строки движения денег, возвраты при отказе — отдельной строкой в день выплаты
  const L = [];
  for (const x of finItems()) {
    if (x.date >= from && x.date <= to) L.push(x);
    if (x.refund && x.refundAt && x.refundAt >= from && x.refundAt <= to) L.push({ ...x, kind: 'refund', date: x.refundAt, amount: x.refund, acc: x.refundAcc || x.acc, refund: 0, check: 'x' });
  }
  return L.reverse().sort((a, b) => b.date.localeCompare(a.date));          // новые сверху, в пределах дня — последние внесённые
}
const sign = x => x.kind === 'in' ? 1 : x.kind === 'move' ? 0 : -1;
function moneyRowHTML(x, mobile) {
  const t = itemText(x), s = sign(x), col = s > 0 ? 'var(--ok)' : s < 0 ? 'var(--bad)' : 'var(--muted)';
  const amt = `<b class="num" style="color:${col};white-space:nowrap">${s > 0 ? '+' : s < 0 ? '−' : ''}${rubN(x.amount)}</b>${x.refund ? `<div class="small muted" style="white-space:nowrap">возврат −${rubN(x.refund)}</div>` : ''}`;
  const act = (x.kind === 'refund' || x.src === 'ref') && ix.ath.get(x.aid) ? `data-act="refund-acc" data-id="${h(x.aid)}"` : x.src === 'sub' ? `data-act="sub-edit" data-id="${h(x.id)}"` : x.src === 'ref' ? '' : `data-act="op-edit" data-id="${h(x.id)}"`;
  const chk = x.kind === 'in' && x.noCheck ? `<span class="chip muted" title="${x.noCheck === 'notax' ? 'Доход не от профессиональной деятельности — не облагается налогом, чек не нужен' : 'Чек оформлен отдельно'}">без чека</span>` : x.kind === 'in' && x.tax && finS(db).checks !== false && x.date >= (finS(db).start || '9999') ? (x.check ? '<span class="chip ok" title="Чек в «Мой налог» выбит">чек</span>' : '<span class="chip warn" title="Чек в «Мой налог» не отмечен">нет чека</span>') : '';
  if (mobile) return `<li class="click" ${act}><div class="who"><b>${h(t.title)}</b><span class="small">${[D.short(x.date), x.kind === 'move' ? '' : accName(x.acc), t.sub].filter(Boolean).map(h).join(' · ')}</span></div><div style="text-align:right">${amt}${chk ? '<div>' + chk + '</div>' : ''}</div></li>`;
  return `<tr class="click" ${act}><td class="num">${D.ru(x.date)}</td><td><b>${h(t.title)}</b>${t.sub ? `<div class="small muted">${h(t.sub)}</div>` : ''}</td><td class="small">${h(x.kind === 'move' ? accName(x.acc) + ' → ' + accName(x.to) : accName(x.acc))}</td><td class="r">${amt}</td><td>${chk}</td></tr>`;

/* ---------- ТАРИФ В ОКНЕ ОПЛАТЫ ---------- */
function tariffHook(p) {
  const d = document.getElementById('dlg'), am = d.querySelector('[name=amount]'), cn = d.querySelector('[name=count]'), pd = d.querySelector('[name=payDate]'), sel = d.querySelector('select[name=athleteId]'), hid = d.querySelector('input[name=athleteId]');
  const note = d.querySelector('#tariff-note'); if (!am || !note) return;
  am.addEventListener('input', () => { am.dataset.touched = '1'; });
  const upd = () => {
    const aid = sel ? sel.value : hid ? hid.value : '', a = aid && ix.ath.get(aid); if (!a) { note.innerHTML = ''; return; }
    pkAuto(a);
    const date = (pd && pd.value) || ix.today, tf = tariffFor(db, a, cn.value, date, pk && +cn.value > 1 ? pk.checked : undefined);
    if (!tf) { note.innerHTML = `<span class="muted">Число занятий не из тарифа (${db.settings.prices.count} или 1) — сумму укажите сами.</span>`
      + ((+cn.value || 0) > 1 ? ' <b style="color:var(--warn)">Если это несколько разовых посещений вперёд — отметьте «Пакет разовых посещений»: иначе это абонемент со сроком по расписанию.</b>' : ''); return; }
    if (tf.price == null) { note.innerHTML = '<b style="color:var(--warn)">Нет даты рождения — тариф (детский или базовый) не определить.</b> Укажите её в карточке.'; return; }
    if (!p && !am.dataset.touched) am.value = tf.price;
    const prev = (ix.subsByAth.get(a.id) || []).filter(q => q !== p && !q.pending && q.payDate && q.payDate < date && +q.count === +db.settings.prices.count).pop();
    const was = prev && tariffFor(db, a, prev.count, prev.payDate);
    note.innerHTML = `Тариф: <b>${h(tf.kind)}</b> — ${rubN(tf.price)} ₽${tf.pkg ? '. Списывается только за посещение, без срока; в журнале — «1/' + (+cn.value) + '», «2/' + (+cn.value) + '»…' : ''}${tf.pkg && +cn.value === +db.settings.prices.count ? ' <b style="color:var(--warn)">Если это абонемент на ' + db.settings.prices.count + ' занятий, а не пакет — снимите галочку «Пакет разовых посещений».</b>' : ''}${tf.age != null ? ` (на дату оплаты ${tf.age} ${plural(tf.age, 'год', 'года', 'лет')})` : ''}.`
      + (was && was.kind === 'детский' && tf.kind === 'базовый' ? ' <b style="color:var(--warn)">С этой оплаты — тариф «Базовый»: исполнилось ' + db.settings.prices.kidUnder + ' лет. Сообщите заказчику (п. 5.4 Положения о льготах).</b>' : '')
      + (+am.value && +am.value !== tf.price ? ' <span class="muted">Сумма другая — по договорённости.</span>' : '');
  };
  cn.addEventListener('input', () => { cn.dataset.touched = '1'; });
  const pk = d.querySelector('[name=pkg]'), pkw = d.querySelector('#pkg-wrap');
  if (pk) pk.addEventListener('change', () => { pk.dataset.touched = '1'; am.dataset.touched = ''; });
  const pkAuto = a => { if (!pk) return; const n = +cn.value || 0; if (pkw) pkw.style.display = n > 1 ? '' : 'none';   // по умолчанию: «Оплата разово» или число занятий не из тарифа — пакет
    if (!p && !pk.dataset.touched) pk.checked = n > 1 && !!a && (perVisitOn(a, (pd && pd.value) || ix.today) || n !== +db.settings.prices.count); };
  if (sel && !p) sel.addEventListener('change', () => { const a = ix.ath.get(sel.value);   // 20.10.2026: разовику — не 12, а число неоплаченных посещений (или 1); пакет — укажите число занятий сами
    if (a && a.payPerVisit && !cn.dataset.touched) { const c = ix.athCalc.get(a.id); cn.value = Math.max(1, (c && c.debtDates || []).length); } });
  [am, cn, pd].forEach(x => x && x.addEventListener('input', upd)); [cn, pd, sel, pk].forEach(x => x && x.addEventListener('change', () => setTimeout(upd, 0)));
  upd();
}

/* ---------- обработчики ---------- */
function keepUntil(ended) { return ended ? (+ended.slice(0, 4) + 3) + ended.slice(4) : ''; }   // п. 12.3.1: 3 года после прекращения
function retention() {
  const left = db.athletes.filter(a => a.status === 'ушёл');
  return { expired: left.filter(a => a.endedAt && keepUntil(a.endedAt) <= ix.today), noDate: left.filter(a => !a.endedAt) };
}
/* ---------- инструктаж по технике безопасности (п. 1.3 Правил посещения, п. 25 Правил № 129) ---------- */
const BRIEF_REASONS = ['перерыв в занятиях более 3 месяцев', 'изменение Правил посещения', 'после несчастного случая', 'выявлено нарушение требований безопасности'];
function addMonths(d, n) { const [y, m, dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate(); t.setUTCDate(Math.min(dd, last)); return D.fmt(t); }
/* когда нужен инструктаж для занятия date: перед первым занятием и после перерыва больше 3 месяцев.
   Возвращает null, если не нужен или уже проведён, иначе { kind, since } */
function briefNeed(a, date, extraPlus) {
  const from = db.settings.briefFrom || '';
  if (!date || date < from) return null;
  const plus = (ix.marks.get(a.id) || []).filter(m => m.mark === '+' && m.date < date).map(m => m.date);
  if (extraPlus) plus.push(...extraPlus.filter(d => d < date));
  const prev = plus.length ? plus.reduce((x, y) => x > y ? x : y) : '';
  const B = a.briefings || [];
  if (!prev) return B.length ? null : { kind: 'первичный', since: '' };
  if (addMonths(prev, 3) >= date) return null;
  return B.some(b => b.date > prev) ? null : { kind: 'внеплановый', since: prev };
}
function lastBrief(a) { const B = a.briefings || []; return B.length ? B.reduce((x, y) => x.date > y.date ? x : y) : null; }
function openBrief(ids, date, kindHint) {
  const L = ids.map(id => ix.ath.get(id)).filter(Boolean); if (!L.length) return;
  const one = L.length === 1 ? L[0] : null;
  const kind = kindHint || (one ? ((one.briefings || []).length ? 'внеплановый' : 'первичный') : 'внеплановый');
  const S = db.settings, by = [S.coachMain, S.coachSecond].filter(Boolean);
  modal('Инструктаж по технике безопасности', `${one ? `<p><b>${h(fullName(one))}</b></p>` : `<p>Отметьте, с кем провели инструктаж:</p><div class="picklist" style="margin-bottom:10px">${L.map(a => { const nd = briefNeed(a, date); return `<label><input type="checkbox" name="ids[]" value="${a.id}" ${nd ? 'checked' : ''}><span class="who"><b>${h(fullName(a))}</b><span class="small">${nd ? (nd.kind === 'первичный' ? 'нужен первичный' : 'нужен внеплановый — перерыв с ' + D.ru(nd.since)) : (lastBrief(a) ? 'последний ' + D.ru(lastBrief(a).date) : 'записей нет')}</span></span></label>`; }).join('')}</div><button type="button" class="btn sm" data-act="check-all">Выбрать всех</button>`}
  <div class="fgrid" style="margin-top:10px">${F('date', 'Дата', date || ix.today, 'date', 'required max="' + ix.today + '"')}${FS('kind', 'Вид', ['первичный', 'внеплановый'], kind)}
  ${FS('reason', 'Причина внепланового', [['', '—'], ...BRIEF_REASONS], kind === 'внеплановый' && one && briefNeed(one, date || ix.today) ? BRIEF_REASONS[0] : '')}${by.length > 1 ? FS('by', 'Проводил', by, by[0]) : `<input type="hidden" name="by" value="${h(by[0] || '')}">`}</div>
  <p class="small muted">Запись в программе — для напоминаний. Подпись занимающегося (законного представителя) ставится в бумажном журнале инструктажа, без неё инструктаж не подтверждён (п. 1.3 Правил).</p>`, { submit: 'Записать', onSubmit(fd) {
    const list = one ? [one.id] : (fd.__multi['ids[]'] || []);
    if (!list.length) { notice('Отметьте хотя бы одного человека'); return false; }
    if (fd.kind === 'внеплановый' && !fd.reason) { notice('Укажите причину внепланового инструктажа — она пишется и в бумажный журнал.'); return false; }
    for (const id of list) { const a = db.athletes.find(x => x.id === id); if (!a) continue;
      a.briefings = (a.briefings || []).filter(b => b.date !== fd.date);
      a.briefings.push({ id: uid('b'), date: fd.date, kind: fd.kind, reason: fd.kind === 'внеплановый' ? fd.reason : '', by: fd.by || '' });
      a.briefings.sort((x, y) => x.date.localeCompare(y.date)); }
    render.keepScroll = true; persist(`Инструктаж записан: ${list.length} ${plural(list.length, 'человек', 'человека', 'человек')}. Не забудьте подписи в журнале`);
  } });
}

/* ---------- отказ от договора (раздел 10 оферты) ---------- */
/* возврат при отказе по каждому абонементу: subId → { sum, paid } (сумма, изменённая вручную, делится пропорционально расчёту) */
function refundBySub() {
  if (refundBySub.ix === ix) return refundBySub.m;
  const m = new Map(); for (const [k, v] of refundShares(db)) m.set(k, { ...v, paid: !!v.paidAt });
  refundBySub.ix = ix; refundBySub.m = m; return m;
}
const subNet = p => p.pending ? 0 : (+p.amount || 0) - ((refundBySub().get(p.id) || {}).sum || 0);
function amountCell(p) {
  if (p.pending) return '<span class="small muted">не оплачен</span>';
  const f = refundBySub().get(p.id), amt = (+p.amount || 0).toLocaleString('ru');
  return f ? `<b>${subNet(p).toLocaleString('ru')}</b><div class="small muted" style="white-space:nowrap" title="Сумма оплаты минус возврат при отказе от договора">${amt} − ${f.sum.toLocaleString('ru')} ${f.paid ? 'возврат' : 'к возврату'}</div>` : amt;
}
function refusePreview(a, date) {
  const d2 = JSON.parse(JSON.stringify(db)), a2 = d2.athletes.find(x => x.id === a.id);
  a2.status = 'ушёл'; a2.endedAt = date;
  const ix2 = buildIndex(d2, ix.today), rows = [];
  for (const p of ix2.subsByAth.get(a.id) || []) {
    const r = ix2.subCalc.get(p.id), x = r && refundInfo(ix2, p); if (!x || !(x.sum > 0)) continue;
    if ((+p.count || 0) <= 1 && !x.notActive) continue;                 // разовое посещение не пересчитывается
    if (!x.notActive && r.end && r.end < date) continue;                // период действия истёк — возврата нет (п. 10.4.7)
    rows.push({ sub: p.id, pay: p.payDate || '', amount: +p.amount || 0, count: +p.count || 0, price: x.price || null, left: x.left, notActive: !!x.notActive, sum: x.sum, pkg: !!r.pkg });   // pkg — пакет разовых (п. 8.8.5 оферты ред. 7)
  }
  const c2 = ix2.athCalc.get(a.id);

}
function refundLines(rows) { return rows.map(x => x.notActive ? `абонемент от ${D.ru(x.pay)} не активирован — ${x.sum.toLocaleString('ru')} ₽` : `${x.left} × ${x.price.toLocaleString('ru')} ₽`).join('; '); }

  const R = a.refund || {};
  return { 'дата_отказа': D.ru(R.date), 'сумма_возврата': (+R.sum || 0).toLocaleString('ru'), 'срок_возврата': D.ru(R.due), 'расчёт': refundLines(R.lines || []) || 'не списанных занятий нет' };
}
function refundHow(R) { return R.how === 'другое' ? R.howNote || 'другое' : [R.how, R.howNote].filter(Boolean).join(': '); }   // «сообщение в MAX: …» / при «другое» — примечание
function openRefuse(id) {

  const calcHTML = P => P.rows.length ? `<ul class="list" style="border:1px solid var(--line);border-radius:8px">${P.rows.map(x => `<li style="padding:8px 10px"><div class="who small"><b>${x.pkg ? 'Пакет разовых' : 'Абонемент'} ${x.count} зан., ${x.amount.toLocaleString('ru')} ₽${x.pay ? ', оплачен ' + D.ru(x.pay) : ''}</b>${x.pkg ? `пакет разовых: не использовано ${x.notActive ? x.count : x.left} — возврат полностью (п. 8.8.5)` : x.notActive ? 'не активирован — возврат полностью (п. 10.4.5)' : `не списано ${x.left} × ${x.price.toLocaleString('ru')} ₽ (п. 10.4.2)`}</div><b class="num">${x.sum.toLocaleString('ru')} ₽</b></li>`).join('')}</ul>`
    : '<p class="small">Не списанных занятий на эту дату нет — возврат не производится (п. 10.4.4).</p>';
  const P0 = refusePreview(a, ix.today);
  modal('Отказ от договора: ' + shortName(a), `<div class="fgrid">${F('date', 'Заявление получено', ix.today, 'date', 'required max="' + ix.today + '"')}${FS('how', 'Как получено (п. 10.3)', ['письменное заявление', 'сообщение в MAX', 'сообщение ВКонтакте', 'другое'], 'сообщение в MAX')}
  <label class="f wide"><span>Примечание: где или как получено</span><input type="text" name="howNote" placeholder="например: Telegram, по e-mail, передал тренеру на занятии"></label>
  ${FS('leaveReason', 'Причина ухода', [['', '— выберите —'], ...(db.settings.leaveReasons || LEAVE_REASONS)], a.leaveReason || '')}${F('leaveNote', 'Причина: подробнее', a.leaveNote || '', 'text', 'placeholder="коротко, без медицинских подробностей"')}</div>
  <h3 style="margin-top:12px">Расчёт на дату заявления</h3><div id="refuse-calc">${calcHTML(P0)}</div><div id="refuse-owe" class="small" style="color:var(--bad);margin-top:6px"></div>
  <div class="fgrid" style="margin-top:10px">${F('sum', 'К возврату, ₽', P0.total, 'number', 'min="0" step="1" inputmode="numeric" required')}</div>
  <p class="small muted">Договор прекращается с даты получения заявления (п. 10.3): статус станет «ушёл», занятия после этой даты не списываются. Вернуть деньги — не позднее 10 календарных дней тем же способом, которым платили (п. 10.4.3). Уменьшать сумму можно только на фактические расходы, подтверждённые документами (п. 10.4.1). Заявление или переписку сохраните.</p>`, { submit: 'Записать отказ', async onSubmit(fd) {
    if (!fd.date || fd.date > ix.today) { notice('Укажите дату получения заявления (не позже сегодняшней).'); return false; }

    { const lr = leaveReasonCheck(fd); if (lr) { notice(lr); return false; } }

    if (sum > P.total && !await ask(`Сумма больше расчётной (${P.total.toLocaleString('ru')} ₽). Вернуть больше по своему решению?`)) return false;
    a.status = 'ушёл'; a.endedAt = fd.date; a.leaveReason = fd.leaveReason; a.leaveNote = String(fd.leaveNote || '').trim();
    a.refund = { date: fd.date, how: fd.how, howNote: String(fd.howNote || '').trim(), sum, calcSum: P.total, due: D.add(fd.date, 10), lines: P.rows, paidAt: sum > 0 ? '' : fd.date, checkAt: sum > 0 ? '' : fd.date };
    render.keepScroll = true; persist(sum > 0 ? `Отказ записан: вернуть ${sum.toLocaleString('ru')} ₽ до ${D.ru(a.refund.due)}` : 'Отказ записан, возврата нет');
  } });
  const dI = $('#dlg [name=date]'), sI = $('#dlg [name=sum]'); let touched = false;

  dI.addEventListener('change', () => { if (!dI.value) return; const P = refusePreview(a, dI.value); $('#refuse-calc').innerHTML = calcHTML(P); if (!touched) sI.value = P.total;

}
