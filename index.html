<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143C30">
<title>Club D23 — учёт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23143C30'/><text x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>D23</text></svg>">
<style>
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --sunk:#F5F7F4; --ink:#15201B; --muted:#5A6760; --line:#D3DAD5;
  --primary:#1D5845; --primary-ink:#FFFFFF; --nav:#143C30; --nav-ink:#D7E6DF;
  --ok:#2A7A4A; --bad:#B42A20; --warn:#9C5B0C; --sick:#2A5DA6; --comp:#6E48A6; --cancel:#6B716D;
  --ok-bg:#E3F1E7; --bad-bg:#FBE6E3; --warn-bg:#FBF0DD; --sick-bg:#E4ECF8; --comp-bg:#EEE7F7;
  --r:10px; --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)} a[href^="tel"]{white-space:nowrap}
details.filt > summary{cursor:pointer;font-weight:600;margin:4px 0 8px}
.num{font-variant-numeric:tabular-nums}
h1{font-size:1.55rem;line-height:1.2;margin:0 0 .2rem;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 .6rem}
h3{font-size:1rem;margin:0 0 .4rem}
.muted{color:var(--muted)} .small{font-size:.86rem}
.hidden{display:none!important}

/* каркас */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-size:1.15rem;color:#fff;letter-spacing:.01em}
.brand span{font-size:.8rem;opacity:.75;display:block}
.mark-logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--nav);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-ink);text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side .sync{margin-top:auto;font-size:.82rem;padding:10px;border-radius:8px;background:rgba(255,255,255,.07)}
.side .sync button{margin-top:8px;width:100%}
main{padding:22px 28px 90px;max-width:1180px;width:100%;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabbar{display:none}

/* элементы */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.flat{padding:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#B9C3BC}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:#174A3A}
.btn.danger{color:var(--bad);border-color:#E7B7B2}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;min-height:30px;font-size:.88rem}
.side .btn{background:#fff;color:var(--nav);border:0}
:focus-visible{outline:3px solid #7FB6A2;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.sick{background:var(--sick-bg);color:var(--sick)}
.chip.muted{background:var(--sunk);color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-height:38px;width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted)}
label.f > span{font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
.fgrid .wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px}
legend{padding:0 6px;font-weight:600;font-size:.9rem}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:none;border:0;background:transparent;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--primary);color:#fff}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* списки */
.list{list-style:none;margin:0;padding:0}
.list > li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.list > li.click{cursor:pointer}
.list > li.click:hover{background:var(--sunk)}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .small{display:block;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th.sortable{cursor:pointer;user-select:none;white-space:nowrap} table.t th.sortable:hover{color:var(--ink)} table.t th.sorted{color:var(--primary)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}

/* подсветка остатка в абонементах */
table.t tr.rem1 td{background:#FBE3C4} table.t tr.rem1 td:first-child{box-shadow:inset 5px 0 0 #D2741C}
table.t tr.rem1 .nm{color:#8A4106}
table.t tr.rem2 td{background:#FFF6D2} table.t tr.rem2 td:first-child{box-shadow:inset 5px 0 0 #E2B92E}
table.t tr.rem2 .nm{color:#6E5303}
table.t tr.pend td{background:#FBE6E3} table.t tr.pend td:first-child{box-shadow:inset 5px 0 0 #B42A20} table.t tr.pend .nm{color:#8E1F17}
table.t tr.pend:hover td{background:#F6D3CE} table.t tr.rem1:hover td{background:#F7D6AE} table.t tr.rem2:hover td{background:#FBEDB8}
.legend i{display:inline-block;width:22px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.lg-pend{background:#FBE6E3;box-shadow:inset 4px 0 0 #B42A20} .lg-rem1{background:#FBE3C4;box-shadow:inset 4px 0 0 #D2741C} .lg-rem2{background:#FFF6D2;box-shadow:inset 4px 0 0 #E2B92E}


/* абонементы списком на телефоне */
.sublist .subside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sublist .subside b{font-size:1.35rem;line-height:1}
.sublist li.rem1{background:#FBE3C4;box-shadow:inset 5px 0 0 #D2741C} .sublist li.rem1 .nm{color:#8A4106}
.sublist li.rem2{background:#FFF6D2;box-shadow:inset 5px 0 0 #E2B92E} .sublist li.rem2 .nm{color:#6E5303}
.sublist li.pend{background:#FBE6E3;box-shadow:inset 5px 0 0 #B42A20} .sublist li.pend .nm{color:#8E1F17}
.sublist .who .small{white-space:normal}
.sublist li > .belt{align-self:center}
.grid2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}

/* пояс — главный визуальный элемент */
.belt{position:relative;display:inline-block;width:70px;height:14px;border-radius:2px;background:var(--bc,#ccc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none;vertical-align:middle}
.belt.two::before{content:"";position:absolute;left:0;right:22px;top:5px;height:4px;background:var(--bc2)}
.belt .tip{position:absolute;right:6px;top:0;bottom:0;width:22px;background:var(--tip,#111);display:flex;gap:2px;justify-content:center;padding:0 2px}
.belt .tip i{width:2.5px;background:#fff;height:100%}
.belt.none{background:repeating-linear-gradient(135deg,#e6e9e6 0 4px,#f4f6f4 4px 8px)}
.belt.lg{width:180px;height:30px;border-radius:3px}
.belt.lg.two::before{top:11px;height:8px;right:46px}
.belt.lg .tip{width:46px;right:12px;gap:4px;padding:0 4px}
.belt.lg .tip i{width:5px}
.belt-txt{display:none}

/* журнал посещений */
.marks{display:inline-flex;gap:4px;flex:none}
.mk{width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:1rem;color:var(--muted)}
.mk[data-m="+"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.mk[data-m="н"].on{background:var(--bad);border-color:var(--bad);color:#fff}
.mk[data-m="б"].on{background:var(--sick);border-color:var(--sick);color:#fff}
.mk[data-m="о"].on{background:var(--cancel);border-color:var(--cancel);color:#fff}
.mk[data-m="с"].on{background:var(--comp);border-color:var(--comp);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:#fff;font-size:.8rem;margin-right:4px}
.cell-m{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font-weight:700;font-size:.85rem}
.cell-m.m-plus{background:var(--ok-bg);color:var(--ok)} .cell-m.m-n{background:var(--bad-bg);color:var(--bad)}
.cell-m.m-b{background:var(--sick-bg);color:var(--sick)} .cell-m.m-o{background:var(--sunk);color:var(--cancel)} .cell-m.m-s{background:var(--comp-bg);color:var(--comp)}
.month{width:auto!important;min-width:60%} .month td.off{background:repeating-linear-gradient(135deg,#eef1ee 0 4px,#f7f8f6 4px 8px)} .month td,.month th{text-align:center;padding:5px 4px} .month td:first-child,.month th:first-child{text-align:left;white-space:nowrap}

/* «сегодня» */
.today-groups{display:flex;gap:10px;flex-wrap:wrap}
.today-groups .btn{min-height:52px;padding:10px 16px;font-weight:600}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none;background:var(--muted)}
.alert.bad .dot{background:var(--bad)} .alert.warn .dot{background:#D08A1C} .alert.sick .dot{background:var(--sick)}
.alert .txt{flex:1;min-width:0}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid #EBCF9F;color:#5B3A06;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* карточка человека */
.person-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.93rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* модальное окно */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(10,30,20,.35)}
dialog::backdrop{background:rgba(12,28,22,.45)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;flex:1}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:100;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.picklist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.picklist label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer}
.picklist label:first-child{border-top:0}
.test-grid{display:grid;grid-template-columns:repeat(5,minmax(70px,1fr));gap:6px}
.test-grid label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.test-grid input{min-height:34px;padding:4px 6px}
.pass{color:var(--ok);font-weight:600} .fail{color:var(--bad);font-weight:600}

/* телефон */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:14px 12px 96px}
  h1{font-size:1.3rem}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--nav);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--nav-ink);text-decoration:none;font-size:.7rem}
  .tabbar a.on{color:#fff;font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .list > li{padding:10px 12px}
  .mk{width:36px;height:40px}
  .card{padding:13px}
  .hide-m{display:none!important}
  .test-grid{grid-template-columns:repeat(3,1fr)}
  .seg{flex-wrap:wrap;overflow:visible} .seg button{flex:1 1 auto}
  .legend .opt-m{display:none}
  .sublist .who b{white-space:normal}
  .sublist li > .belt{width:40px;height:10px}
  .sublist li > .belt .tip{width:14px;right:3px}
  .grow-m{flex-basis:100%}
  table.t{font-size:.85rem} table.t td,table.t th{padding:7px 6px}
  .alert{flex-wrap:wrap} .alert > .row{width:100%;padding-left:21px}
}
@media (min-width:861px){ .show-m{display:none!important} }

/* печать */
.print-only{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  .side,.tabbar,.no-print,.btn,.toast,dialog{display:none!important}
  .shell{display:block} main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .print-only{display:block}
  th.hide-m,td.hide-m{display:table-cell!important}
  .card.hide-m{display:block!important} .card.show-m{display:none!important}
  .scroll{overflow:visible!important}
  table.t{font-size:8.5pt}
  .belt,.chip,.cell-m{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#000;text-decoration:none}
  .card.flat{overflow:visible}
  main{padding:0!important}
  table.t th{background:#fff;position:static}
  table.t td,table.t th{padding:4px 6px;border:1px solid #999}
  @page{margin:12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* печать на монохромном принтере: без заливок, всё чёрным */
@media print{
  *{color:#000!important;-webkit-print-color-adjust:economy;print-color-adjust:economy}
  body,main,.card{background:#fff!important}
  .belt{display:none!important}
  .belt-txt{display:inline;font-size:8.5pt;white-space:nowrap}
  .chip{background:none!important;border:1px solid #000;border-radius:3px;padding:0 4px;font-weight:600}
  .chip.bad{border-width:2px;font-weight:800}
  .chip.muted{border-style:dashed;font-weight:400}
  .cell-m{background:none!important;font-weight:800;width:auto;height:auto}
  .cell-m.m-n{text-decoration:underline}
  table.t th{background:#fff!important;border-bottom:2px solid #000!important;font-weight:700}
  table.t td{border-color:#666!important}
  table.t tr td{background:#fff!important;box-shadow:none!important}
  table.t tr.rem1 .nm,table.t tr.rem2 .nm,table.t tr.pend .nm{font-weight:800}
  table.t tr.rem1 .nm::after{content:" (1)"} table.t tr.rem2 .nm::after{content:" (2)"} table.t tr.pend .nm::after{content:" (ждём оплату)"}
  .month td.off{background:none!important}
  .muted,.small{color:#000!important}
  .pass{font-weight:700} .fail{font-weight:800;text-decoration:underline}
  .stat b{font-size:14pt}
  h1{font-size:15pt}
}

</style></head>

/* ===== D23 CRM — логика расчётов (без DOM) ===== */
const pad = n => String(n).padStart(2, '0');
const D = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  fmt(dt) { return dt.toISOString().slice(0, 10); },
  add(s, n) { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.fmt(d); },
  dow(s) { return (D.parse(s).getUTCDay() + 6) % 7; },              // 0 = Пн … 6 = Вс
  today() { const t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); }, // b − a, дней
  ru(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; },
  short(s) { if (!s) return ''; const [, m, d] = s.split('-'); return d + '.' + m; },
  age(birth, at) {                                                   // полных лет (DATEDIF "Y")
    if (!birth || !at || birth > at) return null;
    const [by, bm, bd] = birth.split('-').map(Number), [ay, am, ad] = at.split('-').map(Number);
    let a = ay - by; if (am < bm || (am === bm && ad < bd)) a--; return a;
  },
  months(a, b) {                                                     // полных месяцев (DATEDIF "M")
    if (!a || !b || a > b) return null;
    const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
    let m = (by - ay) * 12 + (bm - am); if (bd < ad) m--; return m;
  },
  max(a, b) { return !a ? b : !b ? a : (a > b ? a : b); },
  min(a, b) { return !a ? b : !b ? a : (a < b ? a : b); },
};

function cleanPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) d = d.slice(1);
  return d.length === 10 ? d : '';
}
function fmtPhone(p) {
  const d = cleanPhone(p); if (!d) return p || '';
  return '+7 ' + d.slice(0, 3) + ' ' + d.slice(3, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8);
}
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ---------- индекс: всё, что считается один раз на отрисовку ---------- */
function buildIndex(db, today) {
  const S = db.settings;
  const ix = {
    today, db,
    group: new Map(S.groups.map(g => [g.name, g])),
    holiday: new Map(S.holidays.map(h => [h.date, h.reason])),
    ath: new Map(db.athletes.map(a => [a.id, a])),
    marks: new Map(),          // athleteId → [{date, group, mark, sid}] по дате
    groupDates: new Map(),     // группа → [даты занятий] по дате
    subsByAth: new Map(),
    awardsByAth: new Map(),
    freezesByAth: new Map(),
    sessionsSorted: [...db.sessions].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0),
  };
  for (const s of ix.sessionsSorted) {
    if (Object.values(s.marks || {}).some(Boolean)) {            // пустое (открытое по ошибке) занятие не сдвигает прогноз
      if (!ix.groupDates.has(s.group)) ix.groupDates.set(s.group, []);
      ix.groupDates.get(s.group).push(s.date);
    }
    for (const [aid, m] of Object.entries(s.marks || {})) {
      if (!m) continue;
      if (!ix.marks.has(aid)) ix.marks.set(aid, []);
      ix.marks.get(aid).push({ date: s.date, group: s.group, mark: m, sid: s.id });
    }
  }
  const push = (map, k, v) => { if (!map.has(k)) map.set(k, []); map.get(k).push(v); };
  for (const p of db.subs) push(ix.subsByAth, p.athleteId, p);
  for (const w of db.awards) push(ix.awardsByAth, w.athleteId, w);
  for (const f of db.freezes) push(ix.freezesByAth, f.athleteId, f);
  for (const l of ix.subsByAth.values()) l.sort((a, b) => subKey(a).localeCompare(subKey(b)) || db.subs.indexOf(a) - db.subs.indexOf(b));
  for (const l of ix.awardsByAth.values()) l.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  computeSubs(ix);
  ix.athCalc = new Map();
  for (const a of db.athletes) ix.athCalc.set(a.id, calcAthlete(ix, a));
  return ix;
}

/* ---------- расписание ---------- */
function isTrainDay(ix, date, groups) {
  if (ix.holiday.has(date)) return false;
  const d = D.dow(date);
  return groups.some(g => { const G = ix.group.get(g); return G && G.days[d]; });
}
function hasSchedule(ix, groups) { return groups.some(g => { const G = ix.group.get(g); return G && G.days.some(Boolean); }); }
function nthTrainDay(ix, fromInclusive, n, groups) {          // n-е занятие начиная с даты
  if (!fromInclusive || n < 1 || !hasSchedule(ix, groups)) return null;
  let d = fromInclusive, c = 0;
  for (let i = 0; i < 1000; i++) { if (isTrainDay(ix, d, groups)) { c++; if (c === n) return d; } d = D.add(d, 1); }
  return null;
}
function countTrainDays(ix, from, to, groups) {
  let c = 0; if (!from || !to || from > to) return 0;
  for (let d = from; d <= to; d = D.add(d, 1)) if (isTrainDay(ix, d, groups)) c++;
  return c;
}
function trainDaysBetween(ix, from, to, groups) {
  const r = []; if (!from || !to || from > to) return r;
  for (let d = from; d <= to; d = D.add(d, 1)) if (isTrainDay(ix, d, groups)) r.push(d);
  return r;
}

/* ---------- абонемент ---------- */
/* группа человека на дату с учётом переводов */
function groupOn(a, date) {
  const tr = [...(a.transfers || [])].filter(t => t.date).sort((x, y) => x.date.localeCompare(y.date));
  const later = tr.find(t => t.date > date);
  return later ? later.from : a.group;
}
function inGroupOn(a, group, date) { return !!group && (groupOn(a, date) === group || a.group2 === group); }
function subGroups(ix, p) {
  if (p.onlyGroup) return [p.onlyGroup];
  const a = ix.ath.get(p.athleteId); if (!a) return [];

function lowerBound(arr, date, key) { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if ((key ? arr[mid][key] : arr[mid]) < date) lo = mid + 1; else hi = mid; } return lo; }
function subKey(p) { return p.start || p.payDate || p.waitFrom || '9999-12-31'; }   // «ждём оплату» без дат — в конец очереди
function subFirst(ix, p) { return ix.subFirst ? ix.subFirst.get(p.id) || null : p.start || null; }

/* ---------- абонементы: активация и списание (п. 9.2–9.4 оферты) ----------
   Абонемент без ручной даты активируется в день первого посещения после оплаты (9.2.1),
   а если посещения не было — автоматически на 30-й календарный день с даты оплаты (9.2.2).
   Абонементы одного человека расходуются по очереди: следующий может активироваться
   только после окончания предыдущего. */
function computeSubs(ix) {
  ix.subCalc = new Map(); ix.subFirst = new Map(); ix.unpaid = new Map();
  const cutoff = ix.db.settings.sickCheckFrom || '';           // посещения до переноса из Excel не проверяем
  for (const a of ix.db.athletes) {                            // посещения у тех, у кого абонементов нет вовсе
    if (ix.subsByAth.has(a.id)) continue;
    const l = (ix.marks.get(a.id) || []).filter(m => m.mark === '+' && m.date >= cutoff).map(m => m.date);
    if (l.length) ix.unpaid.set(a.id, l);
  }
  for (const [aid, all] of ix.subsByAth) {
    const chains = new Map();
    for (const p of all) { const k = p.onlyGroup || ''; if (!chains.has(k)) chains.set(k, []); chains.get(k).push(p); }
    for (const [og, list] of chains) calcChain(ix, aid, og, list);

}
function setSubStatus(ix, p, r) {
  if (r.notActive) { r.status = p.pending ? 'ждём оплату' : 'не активирован'; r.tone = p.pending ? 'bad' : 'ok'; return; }
  if (r.remaining < 0) { r.status = 'долг ' + (-r.remaining); r.tone = 'bad'; }
  else if (r.remaining === 0) { r.status = 'использован'; r.tone = 'muted'; }
  else if (r.remaining === 1) { r.status = 'осталось 1'; r.tone = 'warn'; }
  else if (r.remaining === 2) { r.status = 'осталось 2'; r.tone = 'warn'; }
  else { r.status = 'действует'; r.tone = 'ok'; }
  if (!(+p.count > 0)) { r.status = 'не указано занятий'; r.tone = 'bad'; }
  if (p.pending) { r.pending = true; r.status = 'ждём оплату'; r.tone = 'bad'; }
}
function calcChain(ix, aid, og, list) {
  const marks = (ix.marks.get(aid) || []).filter(m => !og || m.group === og).map(m => ({ ...m, used: false }));
  let cursor = '', blocked = false;
  const done = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const r = { was: 0, missed: 0, sick: 0, sickCharged: 0, comp: 0, cancel: 0, next: null, end: '', endKind: '', remaining: null, status: '', tone: '', lastCharged: '', charged: 0 };
    const groups = subGroups(ix, p);
    if (p.start) { r.act = p.start; r.first = p.start; r.actKind = 'manual'; }
    else if (!blocked) {
      r.from = D.max(p.payDate || p.waitFrom || '', cursor);
      let visit = null;
      for (let k = lowerBound(marks, r.from, 'date'); k < marks.length; k++) { const m = marks[k]; if (!m.used && m.mark === '+') { visit = m; break; } }
      r.autoDate = p.pending || !p.payDate ? null : D.max(D.add(p.payDate, 30), r.from);
      if (visit && (!r.autoDate || visit.date <= r.autoDate)) { r.act = visit.date; r.first = visit.date; r.actKind = 'visit'; }
      else if (r.autoDate && ix.today >= r.autoDate) { r.act = r.autoDate; r.first = nthTrainDay(ix, r.autoDate, 1, groups) || r.autoDate; r.actKind = 'auto'; }
    }
    if (!r.act) {
      blocked = true; r.notActive = true; r.actKind = 'none'; r.remaining = +p.count || 0;
      if (r.autoDate) r.autoNotifyBy = D.add(r.autoDate, -3);                      // п. 9.2.3
      setSubStatus(ix, p, r); ix.subFirst.set(p.id, null); ix.subCalc.set(p.id, r); done.push([p, r]); continue;
    }
    ix.subFirst.set(p.id, r.first);
    const nm = list.slice(i + 1).find(q => q.start && q.start > r.first);
    r.next = nm ? nm.start : null;
    const fr = (ix.freezesByAth.get(aid) || []).map(f => ({ f, c: calcFreeze(ix, f) }));
    const carry = Math.max(0, +p.carryWas || 0) + Math.max(0, +p.carryMissed || 0);
    const cap = Math.max(0, (+p.count || 0) - carry);
    let used = 0;
    for (let k = lowerBound(marks, r.first, 'date'); k < marks.length; k++) {
      const m = marks[k];
      if (r.next && m.date >= r.next) break;
      if (m.used) continue;
      let charged = m.mark === '+' || m.mark === 'н';
      if (m.mark === 'б' && fr.some(x => x.c.mode === 'lapsed' && x.f.from && x.f.to && m.date >= x.f.from && m.date <= x.f.to)) charged = true;
      if (!charged) { if (used < cap) { if (m.mark === 'б') r.sick++; else if (m.mark === 'с') r.comp++; else if (m.mark === 'о') r.cancel++; } continue; }
      if (used >= cap) break;
      m.used = true; used++;

      r.lastCharged = m.date;
    }
    r.charged = used + carry;
    r.remaining = (+p.count || 0) - r.charged;
    if (r.remaining <= 0) { r.end = r.lastCharged || r.first; r.endKind = 'fact'; cursor = D.add(r.end, 1); }
    else if (!hasSchedule(ix, groups)) { r.endKind = 'nosched'; cursor = '9999-12-31'; }
    else {
      let maxGroupDate = '';
      for (const g of groups) { const gd = ix.groupDates.get(g) || []; let k = r.next ? lowerBound(gd, r.next) - 1 : gd.length - 1; if (k >= 0 && gd[k] >= r.first && gd[k] > maxGroupDate) maxGroupDate = gd[k]; }
      const from = D.max(D.add(r.first, -1), maxGroupDate);
      r.end = nthTrainDay(ix, D.add(from, 1), r.remaining, groups) || ''; r.endKind = 'forecast';
      cursor = r.end ? D.add(r.end, 1) : '9999-12-31';

  }
  // посещения без действующего абонемента — долг того абонемента, после которого они были
  for (const m of marks) {
    if (m.used || m.mark !== '+') continue;
    let t = null;
    for (const [p, r] of done) if (r.first && r.first <= m.date && !(r.next && m.date >= r.next)) t = r;
    if (!t && m.date >= (ix.db.settings.sickCheckFrom || '')) { if (!ix.unpaid.has(aid)) ix.unpaid.set(aid, []); ix.unpaid.get(aid).push(m.date); }
    if (t) { t.was++; t.charged++; t.remaining--; t.debtVisits = (t.debtVisits || 0) + 1; (t.debtDates = t.debtDates || []).push(m.date); if (m.date > t.lastCharged) t.lastCharged = m.date; if (t.remaining <= 0) { t.end = t.lastCharged; t.endKind = 'fact'; } }
  }

}
function currentSub(ix, aid) {               // последний активированный абонемент (без «только на группу» в приоритете)
  const l = (ix.subsByAth.get(aid) || []).filter(p => { const f = subFirst(ix, p); return f && f <= ix.today; });
  const main = l.filter(p => !p.onlyGroup);
  const pick = (main.length ? main : l);
  return pick.length ? pick[pick.length - 1] : null;
}
function upcomingSub(ix, aid) {               // оплаченный, но ещё не начавшийся абонемент
  return (ix.subsByAth.get(aid) || []).find(p => !p.pending && (() => { const f = subFirst(ix, p); return !f || f > ix.today; })()) || null;
}
function pendingSub(ix, aid) {                // абонемент «ждём оплату», если есть
  const l = (ix.subsByAth.get(aid) || []).filter(p => p.pending); return l.length ? l[l.length - 1] : null;
}

function calcFreeze(ix, f) {
  const r = { mode: 'incomplete', ext: 0, text: '' };
  const p = f.subId ? ix.db.subs.find(s => s.id === f.subId) : null;
  if (!p || !f.from || !f.to || f.to < f.from) { r.text = 'Заполните абонемент и даты болезни'; return r; }
  const groups = subGroups(ix, p);
  const first = subFirst(ix, p);
  if (!first) { r.text = 'Абонемент ещё не активирован'; return r; }
  const base = nthTrainDay(ix, first, +p.count || 0, groups);
  r.base = base;
  if (!base) { r.text = 'У группы не задано расписание'; return r; }
  r.ext = countTrainDays(ix, f.from, D.min(f.to, base), groups);
  if (r.ext === 0) { r.mode = 'none'; r.text = 'Болезнь не пришлась на занятия в сроке абонемента — продлевать нечего'; return r; }
  r.returnBy = D.add(D.max(f.to, base), 15);                               // п. 9.5.4 «б»
  const firstAfterBase = nthTrainDay(ix, D.add(base, 1), 1, groups);
  const firstFromReturn = f.returned ? nthTrainDay(ix, f.returned, 1, groups) : null;
  let mode;
  if (f.returned) {
    if (f.returned <= f.to) mode = 'err';
    else if (f.returned > r.returnBy) mode = 'lapsed';
    else mode = f.returned <= base ? 'a' : 'b';
  } else mode = ix.today > r.returnBy ? 'lapsed' : 'wait';
  if (mode === 'err') { r.mode = 'err'; r.text = 'Дата возвращения должна быть позже последнего дня болезни'; return r; }
  let certBy = null;                                                        // п. 9.5.4 «а»
  if (mode === 'a') certBy = D.min(D.add(f.to, 15), firstAfterBase);
  else if (mode === 'b') certBy = D.min(D.add(f.to, 15), firstFromReturn);
  else if (mode === 'wait') certBy = f.to < base ? D.min(D.add(f.to, 15), firstAfterBase) : D.add(f.to, 15);
  r.certBy = certBy;
  const checkBy = mode === 'wait' ? D.add(f.to, 15) : certBy;
  const certIsSession = (mode === 'a' || mode === 'b') && certBy && certBy === (mode === 'a' ? firstAfterBase : firstFromReturn);
  r.certIsSession = certIsSession;
  let lapsedByCert = false;
  if (mode === 'a' || mode === 'b' || mode === 'wait') {
    lapsedByCert = f.certDate ? f.certDate > checkBy : (certIsSession ? ix.today >= checkBy : ix.today > checkBy);
  }
  r.mode = lapsedByCert ? 'lapsed' : mode;
  r.lapsedByCert = lapsedByCert;

  else if (mode === 'wait') r.remindBy = D.add(D.min(certBy, r.returnBy), -5);
  else if (mode === 'a' || mode === 'b') r.remindBy = D.add(certBy, -5);

  if (r.mode === 'b') r.newEnd = nthTrainDay(ix, f.returned, r.ext, groups);
  if (r.mode === 'lapsed') {
    r.text = lapsedByCert
      ? (f.certDate ? 'Справка получена после срока ' + D.ru(checkBy) : 'Справка не получена до ' + D.ru(checkBy)) + ' — продление прекратилось (п. 9.5.5), занятия болезни списываются'
      : 'Не вернулся до ' + D.ru(r.returnBy) + ' — продление прекратилось (п. 9.5.5)';
  } else if (r.mode === 'wait') r.text = 'Ждём возвращения: +' + r.ext + ' зан. продления';
  else r.text = 'Продление +' + r.ext + ' зан., окончание по сроку ' + D.ru(r.newEnd);
  return r;
}

/* ---------- спортсмен ---------- */
function calcAthlete(ix, a) {
  const S = ix.db.settings, t = ix.today, comp = S.competition || {};
  const r = {};
  r.name = fullName(a);
  r.age = D.age(a.birth, t);
  r.ageComp = comp.date ? D.age(a.birth, comp.date) : null;
  r.age3112 = comp.date ? D.age(a.birth, comp.date.slice(0, 4) + '-12-31') : null;
  r.ageForEntry = comp.ageMode === 'по году рождения (на 31.12)' ? r.age3112 : r.ageComp;
  const aw = (ix.awardsByAth.get(a.id) || []).filter(w => w.date && w.date <= t);
  const last = aw[aw.length - 1];
  r.belt = last ? last.belt : ''; r.stripes = last ? +last.stripes || 0 : 0; r.beltDate = last ? last.date : '';
  r.monthsSince = r.beltDate ? D.months(r.beltDate, t) : null;
  // контакт для связи — как в журнале спортсменов
  const has = v => !!String(v || '').trim();
  if (a.mainContact === 'мать' && has(a.motherPhone)) r.contact = a.motherPhone;
  else if (a.mainContact === 'отец' && has(a.fatherPhone)) r.contact = a.fatherPhone;
  else if (a.mainContact === 'спортсмен' && has(a.phone)) r.contact = a.phone;
  else if (r.age != null && r.age >= 15) r.contact = a.phone || a.motherPhone || a.fatherPhone || '';
  else r.contact = a.motherPhone || a.fatherPhone || a.phone || '';
  r.contactWho = r.contact === a.motherPhone && has(a.motherPhone) ? 'мать' : r.contact === a.fatherPhone && has(a.fatherPhone) ? 'отец' : has(r.contact) ? 'сам' : '';
  if (!a.medUntil) r.med = '';
  else if (a.medUntil < t) r.med = 'просрочена';
  else if (D.diff(t, a.medUntil) <= 30) r.med = 'истекает';
  else r.med = 'действует';
  r.noParentPhone = r.age != null && r.age < 15 && !has(a.motherPhone) && !has(a.fatherPhone);
  const cs = currentSub(ix, a.id);
  r.sub = cs; r.subCalc = cs ? ix.subCalc.get(cs.id) : null;
  r.noSub = !!a.noSub;
  r.perVisit = !!a.payPerVisit;
  r.unpaid = a.noSub ? [] : (ix.unpaid.get(a.id) || []);                 // посещения вне любого абонемента
  r.nextSub = upcomingSub(ix, a.id);
  r.pendingSub = pendingSub(ix, a.id);
  r.pendingCalc = r.pendingSub ? ix.subCalc.get(r.pendingSub.id) : null;
  // все неоплаченные посещения: сверх текущего абонемента + без абонемента вообще
  r.debtDates = [...((r.subCalc && r.subCalc.remaining < 0 && r.subCalc.debtDates) || []), ...r.unpaid].sort();
  return r;
}

/* ---------- допуск к аттестации ---------- */
function calcAdmission(ix, a) {
  const A = ix.db.settings.attest;
  const r = { was: 0, missed: 0, sick: 0, tourn: 0 };
  if (!A.prev || !A.next) return { ...r, status: 'нет дат', total: 0 };
  for (const m of ix.marks.get(a.id) || []) {
    if (m.date < A.prev || m.date > A.next) continue;
    if (m.mark === '+') r.was++; else if (m.mark === 'н') r.missed++; else if (m.mark === 'б') r.sick++; else if (m.mark === 'с') r.tourn++;
  }
  r.total = r.was + r.missed + (A.sickMode === 'учитывать' ? r.sick : 0);
  const thr = (+A.threshold || 0) / 100, minT = +A.minTournaments || 0;
  r.pct = r.total ? r.was / r.total : null;
  if (!r.total) r.status = 'нет данных';
  else {
    const okP = r.pct >= thr - 1e-9, okT = r.tourn >= minT;
    r.status = okP && okT ? 'допущен' : !okP && !okT ? 'нет: посещаемость и турниры' : !okP ? 'нет: посещаемость' : 'нет: турниры';
  }
  r.needVisits = r.total ? Math.max(0, Math.ceil(r.total * thr - 1e-9) - r.was) : null;
  r.needTourn = Math.max(0, minT - r.tourn);
  return r;
}

/* ---------- аттестация, этап 1 (физподготовка) ---------- */
const EX = [
  { k: 'jump', label: 'Прыжок', unit: 'см', s: 'jumpS', b: 'jumpB' },
  { k: 'pull', label: 'Подтягивания', unit: '', s: 'pullS', b: 'pullB' },
  { k: 'push', label: 'Отжимания', unit: '', s: 'pushS', b: 'pushB' },
  { k: 'crunch', label: 'Скручивания', unit: '', s: 'crS', b: 'crB' },
  { k: 'mon', label: 'Рукоход', unit: 'пер.', s: 'monS', b: 'monB' },
];
function calcTest(ix, t) {
  const S = ix.db.settings, a = ix.ath.get(t.athleteId);
  const r = { errors: [], checks: [], per: {} };
  if (!a) { r.result = 'НЕТ СПОРТСМЕНА'; return r; }
  if (!t.date || !a.sex || !a.birth || !t.target) { r.result = 'ЗАПОЛНИТЕ ДАТУ, ПОЛ, ДАТУ РОЖДЕНИЯ, ЦЕЛЬ'; r.bad = true; return r; }
  r.age = D.age(a.birth, t.date);
  if (r.age == null) { r.result = 'ПРОВЕРЬТЕ ДАТУ РОЖДЕНИЯ И ДАТУ СДАЧИ'; r.bad = true; return r; }
  const belt = t.belt || '';
  r.track = t.trackManual || (r.age < 16 ? 'Дети' : (!belt || belt === 'белый') ? 'Белый' : 'Синий+');
  const rows = S.norms.filter(n => n.track === r.track && n.sex === a.sex && +n.from <= r.age && +n.to >= r.age);
  if (rows.length !== 1) { r.result = 'НЕТ НОРМЫ — проверьте возраст, пол, трек'; r.bad = true; return r; }
  const N = rows[0]; r.norm = N;
  r.pullKind = N.pullKind; r.pushKind = N.pushKind;
  r.monMode = r.age < 6 ? 'нет' : 'замена';
  const belt_ = t.target === 'пояс', coef = +S.attest.reliefCoef || 0.8;
  const relief = t.relief || {}, res = t.res || {};
  for (const e of EX) {
    if (e.k === 'mon' && r.monMode === 'нет') { r.per[e.k] = { norm: '', credit: '', st: '' }; continue; }
    const norm = N[belt_ ? e.b : e.s], stripe = N[e.s];
    let credit = norm;
    if (norm !== null && norm !== '' && norm !== undefined && relief[e.k]) credit = belt_ ? stripe : Math.ceil(stripe * coef - 1e-9);
    const v = res[e.k];
    let st = '';
    if (v !== '' && v !== null && v !== undefined) {
      if (isNaN(+v) || +v < 0) st = 'не число';
      else if (credit === '' || credit === null || credit === undefined) st = '';
      else st = +v >= +credit ? 'сдал' : 'не сдал';
    }
    r.per[e.k] = { norm, credit, st };
  }
  const allowed = t.place === '1 место' ? 2 : t.place === '2–3 место' ? 1 : 0;
  const reliefCount = EX.filter(e => relief[e.k]).length;
  const main = EX.slice(0, 4).map(e => r.per[e.k].st);
  const failedWithRelief = EX.slice(0, 4).some(e => r.per[e.k].st === 'не сдал' && relief[e.k]);
  const mon = r.per.mon.st;
  if (reliefCount > allowed) { r.result = 'ЛИШНИЕ ПОСЛАБЛЕНИЯ'; r.bad = true; }
  else if (EX.some(e => r.per[e.k].st === 'не число')) { r.result = 'РЕЗУЛЬТАТ НЕ ЧИСЛО'; r.bad = true; }
  else if (main.some(s => s === '')) r.result = 'не завершено';
  else if (main.every(s => s === 'сдал')) r.result = 'СДАН';
  else if (r.monMode === 'нет' || main.filter(s => s === 'не сдал').length > 1 || failedWithRelief) r.result = 'НЕ СДАН';
  else if (mon === '') r.result = 'нужен рукоход (замена)';
  else r.result = mon === 'сдал' ? 'СДАН (замена)' : 'НЕ СДАН';
  // проверки
  const same = ix.db.tests.filter(x => x.id !== t.id && x.athleteId === t.athleteId);
  if (same.some(x => x.date === t.date)) r.checks.push('дубль на эту дату');
  const recentFail = same.some(x => x.date < t.date && D.diff(x.date, t.date) < 28 && calcTestResultOnly(ix, x) === 'НЕ СДАН');
  if (recentFail) r.checks.push('пересдача раньше 4 недель (п. 5.5)');
  if (r.monMode === 'замена' && main.filter(s => s === 'не сдал').length === 1 && failedWithRelief) r.checks.push('замена невозможна: на этом упражнении послабление');
  return r;
}
function calcTestResultOnly(ix, t) { const x = { ...t }; const tests = ix.db.tests; ix.db.tests = []; const r = calcTest(ix, x).result; ix.db.tests = tests; return r; }

/* ---------- подстановка в шаблоны сообщений ---------- */
function firstSession(ix, p) { return subFirst(ix, p) || ''; }
function payDeadline(ix, p, end) {      // день первого занятия нового абонемента
  if (!p || !end) return '';
  return nthTrainDay(ix, D.add(end, 1), 1, subGroups(ix, p)) || '';
}
function fillTemplate(text, ix, a, extra = {}, subId = null) {
  const c = ix.athCalc.get(a.id) || {};
  const p = (subId && ix.db.subs.find(x => x.id === subId)) || c.sub || null;
  const sc = p ? ix.subCalc.get(p.id) || {} : {};
  let end = sc.end || '', payBy = payDeadline(ix, p, end);
  if (p && p.pending) {                        // ждём оплату: окончание — у прошлого абонемента, оплатить к первому занятию нового

    // «б» без заморозки за последние 60 дней
    const fr = ix.freezesByAth.get(a.id) || [];
    const loose = (ix.marks.get(a.id) || []).filter(m => m.mark === 'б' && D.diff(m.date, t) <= 60 && m.date >= (db.settings.sickCheckFrom || '') && !fr.some(f => f.from && f.to && m.date >= f.from && m.date <= f.to));
    if (loose.length) out.push({ tone: 'sick', a, text: `${nm}: «б» без записи о заморозке (${loose.map(m => D.short(m.date)).join(', ')}) — занятия не списываются`, act: 'freeze-new' });
  }
  for (const p of db.subs) {                       // активация абонементов (п. 9.2.3, 9.3.7)
    const a = ix.ath.get(p.athleteId), r = ix.subCalc.get(p.id); if (!a || !r || p.pending || a.status === 'ушёл') continue;
    if (r.notActive && r.autoDate && r.autoNotifyBy && r.autoNotifyBy <= t) out.push({ tone: 'warn', a, text: `${shortName(a)}: абонемент не активирован — автоактивация ${D.ru(r.autoDate)}, сообщить до ${D.ru(r.autoNotifyBy)} (п. 9.2.3)`, tpl: 'Автоактивация абонемента', sub: p.id });
    if (!r.notActive && (r.actKind === 'visit' || r.actKind === 'auto') && r.act <= t && D.diff(r.act, t) <= 3) out.push({ tone: 'muted', a, text: `${shortName(a)}: абонемент активирован ${D.ru(r.first)}${r.actKind === 'auto' ? ' (автоматически)' : ''} — сообщите период ${D.ru(r.first)} — ${D.ru(r.end)} (п. 9.3.7)`, tpl: 'Новый абонемент оплачен', sub: p.id });
  }
  for (const f of db.freezes) {
    const a = ix.ath.get(f.athleteId); if (!a) continue;
    const c = calcFreeze(ix, f);
    if (['a', 'b', 'wait'].includes(c.mode) && !f.certDate && c.certBy) out.push({ tone: 'sick', a, text: `${shortName(a)}: справка о болезни нужна ${c.certIsSession ? 'до начала занятия' : 'не позднее'} ${D.ru(c.certBy)}${c.remindBy ? ', напомнить до ' + D.ru(c.remindBy) : ''}`, freeze: f.id });
    if (c.mode === 'wait' && f.certDate) out.push({ tone: 'sick', a, text: `${shortName(a)}: заморозка — вернуться не позднее ${D.ru(c.returnBy)}`, freeze: f.id });
  }
  // занятия, где у кого-то из группы с действующим абонементом нет отметки (за 3 недели)
  const fromM = D.max(D.add(t, -21), db.settings.sickCheckFrom || '');
  for (const ss of ix.sessionsSorted) {
    if (ss.date < fromM || ss.date > t || !ss.group || !Object.values(ss.marks).some(Boolean)) continue;
    const G = ix.group.get(ss.group); if (!G || !G.days.some(Boolean)) continue;           // «Разово», «Гость» — без расписания, не проверяем
    const who = db.athletes.filter(a => a.status === 'занимается' && !a.payPerVisit && !ss.marks[a.id] && inGroupOn(a, ss.group, ss.date)).filter(a => {
      const c = ix.athCalc.get(a.id); return c.sub && (+c.sub.count || 0) > 1 && c.subCalc && !c.subCalc.notActive && c.subCalc.first <= ss.date; });
    if (who.length) out.push({ tone: 'warn', text: `${D.ru(ss.date)}, ${ss.group}: нет отметки у ${who.length} чел. (${who.slice(0, 4).map(shortName).join(', ')}${who.length > 4 ? '…' : ''}) — поставьте «+», «н» или «б»`, session: ss.id });
  }
  const noGroup = db.sessions.filter(s => !s.group);
  if (noGroup.length) out.push({ tone: 'warn', text: `${noGroup.length} ${plural(noGroup.length, 'занятие', 'занятия', 'занятий')} без группы (${noGroup.map(s => D.short(s.date)).join(', ')}) — выберите группу`, session: noGroup[0].id });
  const comp = db.settings.competition;
  if (comp.date && comp.date < t) out.push({ tone: 'muted', text: `Дата соревнований «${comp.name}» прошла — обновите в настройках`, go: '#settings' });
  const order = { bad: 0, warn: 1, sick: 2, muted: 3 };
  return out.sort((x, y) => order[x.tone] - order[y.tone]);
}

function offSchedule(s) { const g = ix.group.get(s.group); return g && g.days.some(Boolean) && !g.days[D.dow(s.date)]; }
function suggestGroup(date) {
  const dw = D.dow(date); const g = db.settings.groups.find(g => g.days[dw]); return g ? g.name : (db.settings.groups[0] || {}).name;

function sickOn(aid, date) { return db.freezes.some(f => f.athleteId === aid && f.from && f.to && date >= f.from && date <= f.to); }
function sessionMembers(s) {           // только состав выбранной группы
  if (!s.group) return [];

function monthView(tabs, groups) {
  const J = ui.journal, [y, m] = J.month.split('-').map(Number);
  const sess = ix.sessionsSorted.filter(s => s.date.startsWith(J.month) && s.group === J.mgroup);
  const byName = (a, b) => fullName(a).localeCompare(fullName(b), 'ru');
  const marked = new Set(); sess.forEach(s => Object.keys(s.marks).forEach(id => marked.add(id)));
  const mStart = J.month + '-01', mEnd = J.month + '-31';
  const own = a => sess.some(s => inGroupOn(a, J.mgroup, s.date)) || (!sess.length && inGroupOn(a, J.mgroup, mEnd));
  const people = db.athletes.filter(a => own(a) && (a.status === 'занимается' || marked.has(a.id) || (a.transfers || []).some(t => t.date >= mStart && t.date <= mEnd))).sort(byName);
  const period = a => { const t = (a.transfers || []).filter(t => t.date >= mStart && t.date <= mEnd && (t.from === J.mgroup || t.to === J.mgroup));
    return t.map(x => x.to === J.mgroup ? 'с ' + D.short(x.date) : 'до ' + D.short(D.add(x.date, -1))).join(', '); };
  const guests = [...marked].map(id => ix.ath.get(id)).filter(a => a && sess.some(s => s.marks[a.id] && !inGroupOn(a, J.mgroup, s.date))).sort(byName);
  const cls = { '+': 'm-plus', 'н': 'm-n', 'б': 'm-b', 'о': 'm-o', 'с': 'm-s' };
  const prev = m === 1 ? (y - 1) + '-12' : y + '-' + pad(m - 1), next = m === 12 ? (y + 1) + '-01' : y + '-' + pad(m + 1);
  const head = `<thead><tr><th>ФИО</th>${sess.map(s => `<th class="num"><a href="#session/${s.id}">${D.short(s.date).slice(0, 2)}</a><br><span class="small">${DOW[D.dow(s.date)]}</span></th>`).join('')}<th>+</th><th>н</th><th>б</th></tr></thead>`;
  const rows = (list, showGroup) => list.map(a => { const ms = sess.map(s => s.marks[a.id] || ''); const cnt = k => ms.filter(x => x === k).length;
    const off = sess.map(s => !showGroup && !inGroupOn(a, J.mgroup, s.date)); const per = showGroup ? '' : period(a);
    return `<tr><td>${h(shortName(a))}${showGroup ? ' <span class="small muted">' + h(a.group || '') + '</span>' : ''}${per ? ' <span class="small muted">' + per + '</span>' : ''}</td>${ms.map((x, i) => `<td${off[i] ? ' class="off"' : ''}>${x ? `<span class="cell-m ${cls[x] || ''}">${h(x)}</span>` : ''}</td>`).join('')}<td class="num">${cnt('+')}</td><td class="num">${cnt('н')}</td><td class="num">${cnt('б')}</td></tr>`; }).join('');
  return `<div class="topline"><h1>Посещения — ${MONTHS[m - 1]} ${y}</h1>${tabs}</div>
  <div class="card no-print"><div class="row"><button class="btn" data-act="jmonth" data-m="${prev}">←</button><input type="month" id="j-month" value="${J.month}" style="width:auto" data-change="jmonth-input">
  <button class="btn" data-act="jmonth" data-m="${next}">→</button><select data-change="jmgroup" style="width:auto">${groups.map(g => opt(g, J.mgroup)).join('')}</select><span class="spacer"></span><button class="btn primary" data-act="print-blank">Бланк для печати</button></div></div>
  <div class="print-only"><b>${h(db.settings.club)}</b> — журнал посещаемости: ${h(J.mgroup)}, ${MONTHS[m - 1]} ${y}</div>
  <div class="card flat scroll">${sess.length ? `<table class="t month">${head}<tbody>${rows(people, false) || `<tr><td colspan="${sess.length + 4}" class="muted">В группе нет занимающихся</td></tr>`}</tbody></table>`
    : '<div class="empty">В этом месяце у группы занятий нет.</div>'}</div>
  ${guests.length ? `<details class="card flat no-print"><summary style="padding:12px 16px;cursor:pointer"><b>Из других групп на занятиях этой группы: ${guests.length}</b> <span class="small muted">— если человек попал сюда по ошибке, откройте занятие по дате и проверьте группу</span></summary><div class="scroll"><table class="t month">${head}<tbody>${rows(guests, true)}</tbody></table></div></details>` : ''}`;
}

function ageOf(c, mode) { return mode === 'на дату соревнований' ? c.ageComp : mode === 'на 31.12' ? c.age3112 : c.age; }
function filteredPeople() {
  const F = ui.people, q = F.q.trim().toLowerCase().replace(/ё/g, 'е');
  let list = db.athletes.filter(a => {
    const c = ix.athCalc.get(a.id);
    if (F.status !== 'все' && a.status !== F.status) return false;
    if (F.group !== 'все' && a.group !== F.group && a.group2 !== F.group) return false;
    if (F.belt !== 'все' && c.belt !== F.belt) return false;
    if (F.sex !== 'все' && a.sex !== F.sex) return false;

  if (F.sort === 'age') list.sort((a, b) => ((ageOf(ix.athCalc.get(a.id), F.ageMode) ?? 99) - (ageOf(ix.athCalc.get(b.id), F.ageMode) ?? 99)) || byName(a, b));

function closeModal() { const d = document.getElementById('dlg'); if (d && d.open) d.close(); }

  if (U.filter === 'active') rows = rows.filter(x => !x.p.pending && (latestIds.has(x.p.id) && x.r.remaining > 0 || x.r.notActive || (x.r.first && x.r.first > ix.today)));
  if (U.filter === 'ending') rows = rows.filter(x => latestIds.has(x.p.id) && (x.r.remaining === 1 || x.r.remaining === 2) && !ix.athCalc.get(x.a.id).nextSub && x.a.status === 'занимается');
  if (U.filter === 'ended') rows = rows.filter(x => latestIds.has(x.p.id) && x.r.remaining === 0 && (+x.p.count || 0) > 1 && !ix.athCalc.get(x.a.id).nextSub && x.a.status === 'занимается');
  if (U.filter === 'debt') rows = rows.filter(x => x.r.remaining < 0 && !x.p.pending);
  if (U.filter === 'pending') rows = rows.filter(x => x.p.pending);
  if (q) rows = rows.filter(x => fullName(x.a).toLowerCase().includes(q));
  const byName = (x, y) => fullName(x.a).localeCompare(fullName(y.a), 'ru');
  const key = { name: null, start: x => x.r.first || x.p.payDate || '', rem: x => x.r.remaining, end: x => x.r.end || '' }[U.sort];
  rows.sort((x, y) => {
    if (!key) return U.dir * byName(x, y);
    const a = key(x), b = key(y);
    const ea = a === '' || a == null, eb = b === '' || b == null;
    if (ea !== eb) return ea ? 1 : -1;                       // пустые всегда внизу
    const c = typeof a === 'number' ? a - b : String(a).localeCompare(String(b));
    return U.dir * c || byName(x, y);
  });
  const th = (k, label, cls = '') => `<th class="${cls} sortable${U.sort === k ? ' sorted' : ''}" data-act="subs-sort" data-k="${k}" title="Сортировать">${label}<span class="arr">${U.sort === k ? (U.dir > 0 ? ' ▲' : ' ▼') : ''}</span></th>`;
  const sum = rows.filter(x => !x.p.pending).reduce((s, x) => s + (+x.p.amount || 0), 0);
  const seg = [['active', 'Действующие'], ['ending', 'Заканчиваются'], ['ended', 'Закончились'], ['pending', 'Ждём оплату'], ['debt', 'Долги'], ['all', 'Все']];
  return `<div class="topline"><div><h1>Абонементы</h1><div class="muted">${rows.length} · ${sum.toLocaleString('ru')} ₽</div></div>
  <div class="row no-print"><button class="btn primary" data-act="sub-new">Новая оплата</button><button class="btn" data-act="subs-csv">В Excel (CSV)</button></div></div>
  <div class="card no-print"><div class="row"><div class="seg">${seg.map(([k, l]) => `<button data-act="subs-filter" data-f="${k}" class="${U.filter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
  <input type="search" placeholder="Поиск по фамилии" data-change="subs-q" value="${h(U.q)}" style="flex:1;min-width:180px">
  <select data-change="subs-sort" style="width:auto">${[['name', 'по фамилии'], ['rem', 'по остатку'], ['end', 'по окончанию'], ['start', 'по дате начала']].map(([k, l]) => opt(k, U.sort, 'Сортировка: ' + l)).join('')}</select>
  <button class="btn" data-act="subs-dir" title="Обратный порядок">${U.dir > 0 ? '▲ по возрастанию' : '▼ по убыванию'}</button></div>
  <div class="legend" style="margin-top:10px"><span><i class="lg-rem1"></i>осталось 1 занятие</span><span><i class="lg-rem2"></i>осталось 2 занятия</span><span class="small opt-m">(если следующий ещё не оплачен)</span><span><i class="lg-pend"></i>ждём оплату</span></div></div>
  ${(U.filter === 'debt' || U.filter === 'all') && unpaidList().length ? `<div class="card flat"><div style="padding:12px 16px 4px"><h3>Посещения без оплаты (абонемента нет)</h3></div><ul class="list">${unpaidList().map(({ a, c }) => `<li><div class="who"><b>${h(shortName(a))}</b><span class="small">${h(a.group)} · ${c.unpaid.map(d => D.short(d)).join(', ')}</span></div><span class="chip bad">не оплачено ${c.unpaid.length}</span><button class="btn sm" data-act="sub-new" data-id="${a.id}">Оплата</button></li>`).join('')}</ul></div>` : ''}
  <div class="card flat show-m"><ul class="list sublist">${rows.map(({ p, r, a }) => { const hl = p.pending ? ' pend' : latestIds.has(p.id) && !ix.athCalc.get(a.id).nextSub && !ix.athCalc.get(a.id).pendingSub && (r.remaining === 1 || r.remaining === 2) ? ' rem' + r.remaining : '';
    return `<li class="click${hl}" data-act="sub-edit" data-id="${p.id}"><div class="who"><b class="nm">${h(shortName(a))}</b>
      <span class="small">${h(p.onlyGroup || a.group || '')} · ${p.count} зан. · ${r.first ? 'с ' + D.short(r.first) : (p.pending ? 'с 1-го посещения' : 'не активирован' + (r.autoDate ? ', до ' + D.short(r.autoDate) : ''))}</span>
      <span class="small">${r.end ? (r.endKind === 'fact' ? 'последнее ' : 'окончание ') + D.ru(r.end) : (r.endKind === 'nosched' ? 'нет расписания' : '')}</span></div>
      <div class="subside"><b class="num">${r.remaining}</b><span class="chip ${r.tone}">${h(r.status)}</span></div></li>`; }).join('') || '<li class="empty">Нет абонементов в этом списке</li>'}</ul></div>
  <div class="card flat scroll hide-m"><table class="t"><thead><tr>${th('name', 'ФИО')}<th class="hide-m">Оплата</th>${th('start', 'С')}<th class="r">Занятий</th><th class="r hide-m">Сумма</th><th class="r hide-m">Был</th><th class="r hide-m">Не был</th><th class="r hide-m">Болел</th>${th('rem', 'Остаток', 'r')}${th('end', 'Окончание')}<th>Статус</th></tr></thead><tbody>
  ${rows.map(({ p, r, a }) => { const hl = p.pending ? ' pend' : latestIds.has(p.id) && !ix.athCalc.get(a.id).nextSub && !ix.athCalc.get(a.id).pendingSub && (r.remaining === 1 || r.remaining === 2) ? ' rem' + r.remaining : '';
  return `<tr class="click${hl}" data-act="sub-edit" data-id="${p.id}"><td><b class="nm">${h(shortName(a))}</b><div class="small muted">${h(p.onlyGroup || a.group)}</div></td><td class="hide-m num">${D.ru(p.payDate)}</td><td class="num">${startLabel(p, r, true)}</td>
  <td class="r num">${p.count}</td><td class="r num hide-m">${p.pending ? '<span class="small muted">не оплачен</span>' : (+p.amount || 0).toLocaleString('ru')}</td><td class="r num hide-m">${r.was}</td><td class="r num hide-m">${r.missed}</td><td class="r num hide-m">${r.sick}</td>
  <td class="r num"><b>${r.remaining}</b></td><td class="num">${r.end ? D.ru(r.end) : (r.endKind === 'nosched' ? '<span class="small muted">нет расписания</span>' : '')}</td><td><span class="chip ${r.tone}">${h(r.status)}</span></td></tr>`; }).join('') || '<tr><td colspan="11" class="empty">Нет абонементов в этом списке</td></tr>'}</tbody></table></div>
  <p class="small muted">Списывается «был» и «не был» (п. 9.4). «Болел» не списывается, пока заморозка не прекращена (п. 9.5). Окончание — прогноз по расписанию группы и нерабочим дням (п. 9.3).</p>`;
}
function openSub(id, athleteId) {

  ${r ? `<div class="card" style="margin:12px 0 0;background:var(--sunk)"><div class="stats"><div class="stat"><b>${r.was}</b><span class="small muted">был</span></div><div class="stat"><b>${r.missed}</b><span class="small muted">не был</span></div><div class="stat"><b>${r.sick}</b><span class="small muted">болел</span></div><div class="stat"><b>${r.remaining}</b><span class="small muted">остаток</span></div></div>

      const same = !p && db.subs.find(q => q.athleteId === fd.athleteId && q.payDate && q.payDate === fd.payDate && +q.count === +fd.count && (q.onlyGroup || '') === (fd.onlyGroup || ''));
      if (same && !confirm(`У этого человека уже записана оплата ${D.ru(fd.payDate)} на ${same.count} зан. (${(+same.amount || 0).toLocaleString('ru')} ₽). Записать ещё одну?\n\nЕсли это повтор по ошибке — нажмите «Отмена».`)) return false;

      if (!p) db.subs.push(t);
      persist(p ? 'Абонемент сохранён' : t.pending ? 'Записан абонемент «ждём оплату»' : 'Оплата записана');
      if (!p && !t.pending && t.count > 1) setTimeout(() => { const rr = ix.subCalc.get(t.id); openMsg(t.athleteId, rr && rr.notActive ? 'Абонемент оплачен' : 'Новый абонемент оплачен', {}, t.id); }, 50);

  const sel = document.querySelector('#dlg select[name=athleteId]');

    const lp = [...(ix.subsByAth.get(id) || [])].pop(); if (lp && lp.amount) document.querySelector('#dlg [name=amount]').value = lp.amount;

  ${FS('subId', 'Абонемент', subs.map(p => [p.id, (subFirst(ix, p) ? 'с ' + D.ru(subFirst(ix, p)) : 'не активирован, оплата ' + D.ru(p.payDate)) + ', ' + p.count + ' зан.']), v.subId, 'class="wide"')}
  ${F('from', 'Болел с (по справке)', v.from, 'date', 'required')}${F('to', 'по (включительно)', v.to, 'date', 'required')}

  <p class="small muted">Даты болезни — по справке, не раньше дня, когда клиент предупредил. Справка — не позднее 15 дней после болезни и до первого занятия продления (п. 9.5.4). Без неё продление прекращается (п. 9.5.5).</p>
  ${fc ? `<div class="card" style="margin:8px 0 0;background:var(--sunk)"><b>${h(fc.text)}</b><dl class="kv small" style="margin-top:8px">
    ${fc.base ? `<dt>Базовое окончание</dt><dd>${D.ru(fc.base)}</dd>` : ''}${fc.ext ? `<dt>Занятий продления</dt><dd>${fc.ext}</dd>` : ''}
    ${fc.certBy ? `<dt>Справка (п. 9.5.4 «а»)</dt><dd>${f.certDate ? 'получена ' + D.ru(f.certDate) : (fc.certIsSession ? 'до начала занятия ' : 'не позднее ') + D.ru(fc.certBy)}</dd>` : ''}
    ${fc.returnBy ? `<dt>Вернуться не позднее (п. 9.5.4 «б»)</dt><dd>${f.returned ? 'вернулся ' + D.ru(f.returned) : D.ru(fc.returnBy)}</dd>` : ''}
    ${fc.remindBy ? `<dt>Напомнить клиенту (п. 9.5.6)</dt><dd>не позднее ${D.ru(fc.remindBy)}</dd>` : ''}</dl></div>` : ''}`;
  modal('Заморозка по болезни', body, {
    extraBtn: f ? `<button type="button" class="btn danger" data-act="freeze-del" data-id="${f.id}">Удалить</button><button type="button" class="btn" data-act="freeze-mark" data-id="${f.id}">Проставить «б» в журнале</button><button type="button" class="btn" data-act="msg" data-id="${aid}" data-sub="${f.subId}" data-tpl="Абонемент продлён">Сообщение</button>` : '',
    onSubmit(fd) {
      if (fd.to < fd.from) { alert('Дата окончания болезни раньше начала'); return false; }
      const t = f || { id: uid('f'), athleteId: aid };
      Object.assign(t, { subId: fd.subId, from: fd.from, to: fd.to, returned: fd.returned, certDate: fd.certDate, note: fd.note.trim() });
      if (!f) db.freezes.push(t);
      persist('Заморозка сохранена');
      if (!f) setTimeout(() => { if (confirm('Проставить «б» на занятиях группы за период болезни?')) markFreeze(t.id); }, 50);
      else if (t.certDate) setTimeout(() => {          // справка получена — «н» за период болезни меняем на «б»
        const a = ix.ath.get(t.athleteId); const n = db.sessions.filter(s => inGroupOn(a, s.group, s.date) && s.date >= t.from && s.date <= t.to && s.marks[a.id] === 'н').length;
        if (n && confirm(`Справка получена. Заменить «н» на «б» за период болезни (${n} ${plural(n, 'занятие', 'занятия', 'занятий')})? Эти занятия не будут списаны.`)) markFreeze(t.id);
      }, 50);
    },
  });
}
function markFreeze(fid) {
  const f = db.freezes.find(x => x.id === fid), a = ix.ath.get(f.athleteId);
  let n = 0;
  for (const s of db.sessions) if (inGroupOn(a, s.group, s.date) && s.date >= f.from && s.date <= f.to && (!s.marks[a.id] || s.marks[a.id] === 'н')) { s.marks[a.id] = 'б'; n++; }
  persist(n ? `Проставлено «б»: ${n}` : 'Нечего менять: за этот период нет занятий с пустой отметкой или «н»');
}

function defaultStart(aid) {            // первое занятие после окончания текущего абонемента
  const c = ix.athCalc.get(aid); if (!c || !c.sub || !c.subCalc) return ix.today;
  const s = c.subCalc;
  if (s.remaining > 0 && s.end) return payDeadline(ix, c.sub, s.end) || ix.today;
  if (s.remaining <= 0 && s.end) { const nx = payDeadline(ix, c.sub, s.end); return nx && nx > ix.today ? nx : ix.today; }
  return ix.today;
}

/* ---------- копия в файл / из файла ---------- */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('d23crm', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvGet(k) { try { const d = await idb(); return await new Promise(r => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }
async function kvSet(k, v) { try { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }
function markExported(name) { meta.lastExport = new Date().toISOString(); meta.exportedRev = db.rev; if (name) meta.lastExportName = name; writeMeta(); rerender(); toast(name ? 'Копия сохранена: ' + name : 'Копия сохранена'); }
const COPY_RE = /^D23_данные_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}(-\d{2})?(_[а-яa-z]+)?\.json$/i;
function isPhone() { return /Android|iPhone|iPad/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches; }
function copyName(withSec) {
  const t = new Date();
  return `D23_данные_${D.today()}_${pad(t.getHours())}-${pad(t.getMinutes())}${withSec ? '-' + pad(t.getSeconds()) : ''}_${isPhone() ? 'тел' : 'пк'}.json`;
}
async function copyDir(ask) {                  // папка для копий на компьютере (запоминается)
  if (!window.showDirectoryPicker) return null;
  let dir = await kvGet('copyDir');
  if (dir) { try { if ((await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') dir = null; } catch (e) { dir = null; } }
  if (!dir && ask) {
    alert('Выберите папку для копий — лучше папку Яндекс Диска. Программа запомнит её, и дальше копии будут сохраняться туда одной кнопкой.');
    dir = await showDirectoryPicker({ id: 'd23copies', mode: 'readwrite', startIn: 'documents' });
    await kvSet('copyDir', dir);
  }
  return dir;
}
async function exportData(newDir) {
  const json = JSON.stringify(db, null, 1);
  if (window.showDirectoryPicker) {
    try {
      if (newDir) await kvSet('copyDir', null);
      const dir = await copyDir(true);
      if (dir) {
        let name = copyName(false);
        const minute = name.replace(/_(тел|пк)\.json$/, '');
        for await (const [n] of dir.entries()) if (n.startsWith(minute)) { name = copyName(true); break; }
        const fh = await dir.getFileHandle(name, { create: true });
        const wr = await fh.createWritable(); await wr.write(json); await wr.close();
        meta.copyDirName = dir.name;
        await pruneCopies(dir);
        markExported(name); return;
      }
    } catch (e) { if (e.name === 'AbortError') return; console.warn(e); }
  }
  const name = copyName(false);
  download(name, json, 'application/json');
  markExported(name);
}
async function pruneCopies(dir) {               // оставляем последние N копий в папке
  const keep = +db.settings.copiesKeep || 0; if (!keep) return;
  const files = [];
  for await (const [n, h] of dir.entries()) if (h.kind === 'file' && COPY_RE.test(n)) { try { files.push({ n, t: (await h.getFile()).lastModified }); } catch (e) {} }
  files.sort((a, b) => b.t - a.t || b.n.localeCompare(a.n));
  for (const f of files.slice(keep)) { try { await dir.removeEntry(f.n); } catch (e) {} }
}
async function importLatest() {                 // компьютер: самая свежая копия из папки
  try {
    const dir = await copyDir(true); if (!dir) return importData();
    let best = null;
    for await (const [n, h] of dir.entries()) {
      if (h.kind !== 'file' || !/\.json$/i.test(n)) continue;
      const f = await h.getFile();
      if (!best || f.lastModified > best.lastModified) best = f;
    }
    if (!best) { alert('В папке «' + dir.name + '» нет файлов копий.'); return; }
    applyImport(await best.text(), best.name);
  } catch (e) { if (e.name !== 'AbortError') { console.warn(e); importData(); } }
}
function download(name, text, type) {
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function importData() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => applyImport(r.result, f.name); r.readAsText(f); };
  inp.click();
}
function applyImport(text, fname) {
  let d; try { d = JSON.parse(text); } catch (e) { alert('Файл не читается: это не копия данных D23.'); return; }
  if (d.app !== 'D23CRM') { alert('Это не копия данных D23. Выберите файл, сохранённый этой программой.'); return; }
  if (db && db.rev) {
    const older = d.updatedAt && db.updatedAt && d.updatedAt < db.updatedAt;
    const head = `Файл: ${fname}\nДанные в файле от ${new Date(d.updatedAt).toLocaleString('ru')}\nДанные здесь от ${new Date(db.updatedAt).toLocaleString('ru')}\n\n`;
    const msg = older
      ? head + 'Файл СТАРЕЕ данных на этом устройстве. Заменить данные здесь более старыми? Текущая версия сохранится в «Прежних версиях».'
      : head + 'Заменить данные на этом устройстве копией из файла? Текущая версия сохранится в «Прежних версиях».';
    if (!confirm(msg)) return;
    snapshot('перед загрузкой копии');
  }
  db = normalize(d);
  try { localStorage.setItem(LS_DB, JSON.stringify(db)); } catch (e) { alert('Не хватает места в браузере'); }
  meta.exportedRev = db.rev; meta.lastExport = meta.lastExport || new Date().toISOString(); meta.lastImportName = fname; meta.lastImportAt = new Date().toISOString(); writeMeta();
  location.hash = '#today'; render(); toast('Загружено: ' + fname);
}

function csv(rows) { return '\ufeff' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n'); }

function openPrint(title, html, css = '') {

  w.document.write(`<html><head><meta charset="utf-8"><title>${h(title)}</title><style>*{color:#000}body{font:10.5pt Arial,sans-serif;margin:12mm}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px 6px;text-align:left}th{background:#fff;font-weight:700;border-bottom:2px solid #000}h3{margin:14px 0 4px}tr{page-break-inside:avoid}${css}</style></head><body>${html}<script>window.print()<\/script></body></html>`);
  w.document.close();
}

function blankPeople(g, first, last) {

function printBlank(g, ym, fromNo, perPage, filled, rightPad = 4) {
  const [y, m] = ym.split('-').map(Number), [first, last] = monthBounds(ym);
  const dates = new Set();
  for (let d = first; d <= last; d = D.add(d, 1)) if (isTrainDay(ix, d, [g])) dates.add(d);
  const sess = db.sessions.filter(s => s.group === g && s.date >= first && s.date <= last);
  sess.forEach(s => dates.add(s.date));
  const cols = [...dates].sort();
  if (!cols.length) { alert(`У группы «${g}» в ${MONTHS[m - 1]} нет дней занятий: задайте расписание группы в Настройках.`); return; }
  const people = blankPeople(g, first, last).map((a, i) => ({ a, no: i + 1 })).filter(x => x.no >= fromNo);
  const markOf = (a, d) => { if (!filled) return ''; const s = sess.filter(x => x.date === d).find(x => x.marks[a.id]); return s ? s.marks[a.id] : ''; };

  const W = 297 - 25 - 7 - rightPad, fixed = { no: 8, fio: 54, tot: 11, extra: [17, 17, 7, 17, 7, 17, 7] };
  const extraSum = fixed.extra.reduce((s, x) => s + x, 0);
  let fio = fixed.fio, dw = (W - fixed.no - fio - fixed.tot - extraSum) / cols.length;
  if (dw < 6) { fio = Math.max(40, fio - (6 - dw) * cols.length); dw = (W - fixed.no - fio - fixed.tot - extraSum) / cols.length; }
  dw = Math.min(dw, 12);
  const PAGE_H = 210 - 9 - 9 - 1.5, TITLE_H = 12, HEAD_H = 16, FOOT_H = 6;
  const rowH = ((PAGE_H - TITLE_H - HEAD_H - FOOT_H) / perPage).toFixed(2);
  const extraNames = ['Текущий', 'Продление', 'Количество', 'Следующий месяц', 'О.пр', 'Дата', 'Н.Бн'];
  const head = `<div class="ttl"><div><div class="h1">ЖУРНАЛ ПОСЕЩАЕМОСТИ</div><div>${h(db.settings.club)}</div></div>
    <div class="meta"><span>Группа: <b>${h(g)}</b></span><span>Месяц: <b>${MONTHS[m - 1]}</b></span><span>Год: <b>${y}</b></span></div></div>`;
  const thead = `<colgroup><col style="width:${fixed.no}mm"><col style="width:${fio}mm"><col style="width:${fixed.tot}mm">${cols.map(() => `<col style="width:${dw.toFixed(2)}mm">`).join('')}${fixed.extra.map(x => `<col style="width:${x}mm">`).join('')}</colgroup>
    <thead><tr class="hd"><th class="b">№</th><th class="fio">Фамилия Имя</th><th>Итого</th>${cols.map(d => `<th class="dt">${+d.slice(8)}<br><span>${DOW[D.dow(d)].toLowerCase()}</span></th>`).join('')}${extraNames.map((n, i) => `<th class="ex${i === 0 ? ' b' : ''}${[2, 4, 6].includes(i) ? ' rot' : ''}"><div>${n}</div></th>`).join('')}</tr></thead>`;
  const pages = [];
  for (let i = 0; i < Math.max(1, people.length); i += perPage) {
    const chunk = people.slice(i, i + perPage);
    const rows = [];
    for (let k = 0; k < perPage; k++) {
      const x = chunk[k];
      const ms = x ? cols.map(d => markOf(x.a, d)) : cols.map(() => '');
      const tot = ms.filter(v => v === '+').length;
      rows.push(`<tr><td class="b c">${x ? x.no : ''}</td><td class="fio">${x ? h(shortName(x.a)) : ''}</td><td class="c">${tot || ''}</td>${ms.map(v => `<td class="c">${h(v)}</td>`).join('')}${fixed.extra.map((_, j) => `<td${j === 0 ? ' class="b"' : ''}></td>`).join('')}</tr>`);
    }
    pages.push(`<section class="page">${head}<table>${thead}<tbody>${rows.join('')}</tbody></table>
      <div class="foot"><span>+ был · н не был · б болел · о отменено · с соревнования</span><span>Тренер: ____________________</span></div></section>`);
  }
  openPrint(`Журнал ${g} ${MONTHS[m - 1]} ${y}`, pages.join(''), `
    @page{size:A4 landscape;margin:9mm 7mm 9mm 25mm}
    body{margin:0;font-size:9pt}
    .page{height:${PAGE_H}mm;overflow:hidden;padding-right:1mm;box-sizing:border-box;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto;break-after:auto}
    .ttl{display:flex;justify-content:space-between;align-items:flex-end;height:${TITLE_H - 1.5}mm;margin-bottom:1.5mm}
    .h1{font-size:14pt;font-weight:700;letter-spacing:.02em}
    .meta{display:flex;gap:16px;font-size:11pt}
    table{table-layout:fixed;width:${W}mm}
    th,td{border:1px solid #000;padding:0;overflow:hidden}
    th{font-weight:700;font-size:8pt;background:#fff;text-align:center;vertical-align:middle}
    tr.hd th{height:16mm}
    th.dt{font-size:9pt}th.dt span{font-weight:400;font-size:7pt}
    th.ex div{font-size:6.3pt;line-height:1.15;padding:1px;overflow-wrap:normal;word-break:keep-all}
    th.rot div{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;white-space:nowrap}
    td{height:${rowH}mm;font-size:9pt}
    td.c{text-align:center}
    td.fio,th.fio{text-align:left;padding:0 4px;white-space:nowrap;font-size:10pt}
    th.b,td.b{border-left:2px solid #000}
    .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:8pt;height:${FOOT_H}mm}
    tr{page-break-inside:avoid}`);
