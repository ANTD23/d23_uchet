  'rep-range': el => { $('#dlg [name=from]').value = el.dataset.f; $('#dlg [name=to]').value = el.dataset.t; },
  'subs-sort': el => { const k = el.dataset.k; if (ui.subs.sort === k) ui.subs.dir = -ui.subs.dir; else { ui.subs.sort = k; ui.subs.dir = k === 'start' ? -1 : 1; } rerender(); },
  'subs-dir': () => { ui.subs.dir = -ui.subs.dir; rerender(); },
  'subs-filter': el => { ui.subs.filter = el.dataset.f; rerender(); },
  'freeze-new': el => openFreeze(null, el.dataset.id), 'freeze-edit': el => openFreeze(el.dataset.id),
  'freeze-del': el => { if (!confirm('Удалить заморозку?')) return; db.freezes = db.freezes.filter(f => f.id !== el.dataset.id); closeModal(); persist('Заморозка удалена'); },
  'freeze-mark': el => { closeModal(); markFreeze(el.dataset.id); },
  'award-new': el => openAward(null, el.dataset.id), 'award-edit': el => openAward(el.dataset.id),
  'award-del': el => { if (!confirm('Удалить запись о присвоении?')) return; db.awards = db.awards.filter(w => w.id !== el.dataset.id); closeModal(); persist('Удалено'); },
  'msg': el => openMsg(el.dataset.id, el.dataset.tpl, el.dataset.extra ? JSON.parse(el.dataset.extra) : {}, el.dataset.sub || null),
  'msg-share': () => { navigator.share({ text: $('#msg-text').value }).catch(() => {}); },
  'msg-copy': () => { const t = $('#msg-text'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Скопировано')).catch(() => { document.execCommand('copy'); toast('Скопировано'); }); },
  'test-add': () => openTestAdd(), 'test-protocol': () => printProtocol(),
  'test-del': el => { if (!confirm('Удалить строку сдачи?')) return; db.tests = db.tests.filter(t => t.id !== el.dataset.id); render.keepScroll = true; persist(); },
  'set-test-date': el => { ui.attest.date = el.dataset.date; ui.attest.group = 'все'; },
  'check-all': () => document.querySelectorAll('#dlg .picklist input[type=checkbox]').forEach(c => c.checked = true),
  'norm-add': () => { db.settings.norms.push({ track: '', sex: '', from: '', to: '' }); rerender(); persist(); },
  'norm-del-last': () => { if (confirm('Удалить последнюю строку норм?')) { db.settings.norms.pop(); render.keepScroll = true; persist(); } },
  'group-add': () => { db.settings.groups.push({ name: 'Новая группа', days: [false, false, false, false, false, false, false] }); render.keepScroll = true; persist(); },
  'group-del': el => { const g = db.settings.groups[+el.dataset.i]; const used = db.athletes.filter(a => a.group === g.name || a.group2 === g.name).length + db.sessions.filter(s => s.group === g.name).length;
    if (used && !confirm(`Группа «${g.name}» используется (${used}). Удалить её из списка? Записи в журнале и у спортсменов останутся с этим названием.`)) return; db.settings.groups.splice(+el.dataset.i, 1); render.keepScroll = true; persist(); },
  'hol-add': () => { const d = $('#hol-date').value; if (!d) return; db.settings.holidays = db.settings.holidays.filter(x => x.date !== d); db.settings.holidays.push({ date: d, reason: $('#hol-reason').value.trim() || 'нерабочий день' }); render.keepScroll = true; persist('Добавлено'); },
  'hol-del': el => { db.settings.holidays = db.settings.holidays.filter(x => x.date !== el.dataset.date); render.keepScroll = true; persist(); },
  'tpl-add': () => { db.settings.templates.push({ title: 'Новый шаблон', text: 'Здравствуйте! ' }); render.keepScroll = true; persist(); },
  'tpl-del': el => { if (confirm('Удалить шаблон?')) { db.settings.templates.splice(+el.dataset.i, 1); render.keepScroll = true; persist(); } },
  'people-print': () => window.print(), 'people-entry': () => printEntry(),
  'people-csv': () => { const rows = [['ФИО', 'Пол', 'Дата рождения', 'Возраст', 'Группа', 'Вторая группа', 'Статус', 'Пояс', 'Страйпы', 'Вес', 'Телефон', 'Мать', 'Тел. матери', 'Отец', 'Тел. отца', 'Медсправка до', 'Примечание']];
    (location.hash.startsWith('#people') ? filteredPeople() : db.athletes).forEach(a => { const c = ix.athCalc.get(a.id); rows.push([fullName(a), a.sex, D.ru(a.birth), c.age ?? '', a.group, a.group2, a.status, c.belt, c.stripes || '', a.weight, a.phone, a.motherName, a.motherPhone, a.fatherName, a.fatherPhone, D.ru(a.medUntil), a.note]); });
    download('D23_спортсмены_' + ix.today + '.csv', csv(rows), 'text/csv'); },
  'subs-csv': () => { const rows = [['ФИО', 'Группа', 'Только на группу', 'Дата оплаты', 'Действует с', 'Занятий', 'Сумма', 'Был', 'Не был', 'Болел', 'Остаток', 'Окончание', 'Статус', 'Примечание']];
    db.subs.forEach(p => { const a = ix.ath.get(p.athleteId), r = ix.subCalc.get(p.id); if (a) rows.push([fullName(a), a.group, p.onlyGroup, p.pending ? 'ждём оплату' : D.ru(p.payDate), r.first ? D.ru(r.first) : 'не активирован', p.count, p.pending ? '' : p.amount, r.was, r.missed, r.sick, r.remaining, D.ru(r.end), r.status, p.note]); });
    download('D23_абонементы_' + ix.today + '.csv', csv(rows), 'text/csv'); },
  'visits-csv': () => { const rows = [['Дата', 'День', 'Группа', 'ФИО', 'Отметка']];
    ix.sessionsSorted.forEach(s => Object.entries(s.marks).forEach(([id, m]) => { const a = ix.ath.get(id); if (a) rows.push([D.ru(s.date), DOW[D.dow(s.date)], s.group, fullName(a), m]); }));
    download('D23_посещения_' + ix.today + '.csv', csv(rows), 'text/csv'); },
  'snap-restore': el => { const snaps = JSON.parse(localStorage.getItem(LS_SNAP) || '[]'); const s = snaps[+el.dataset.i];
    if (!s || !confirm('Вернуть версию от ' + new Date(s.at).toLocaleString('ru') + '? Текущие данные сохранятся как прежняя версия.')) return;
    snapshot('перед возвратом версии'); db = normalize(JSON.parse(s.data)); persist('Версия восстановлена'); },
  'wipe': () => { if (!confirm('Удалить все данные из этого браузера? Сначала сохраните копию в файл.')) return; if (prompt('Для подтверждения напишите: УДАЛИТЬ') !== 'УДАЛИТЬ') return;
    localStorage.removeItem(LS_DB); localStorage.removeItem(LS_SNAP); localStorage.removeItem(LS_META); db = null; meta = { lastExport: null, exportedRev: 0 }; render(); },
};
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act && !(act.tagName === 'INPUT' || act.tagName === 'SELECT')) {
    const fn = ACT[act.dataset.act];
    if (fn) { e.preventDefault(); fn(act, e); }
    if (act.dataset.go) location.hash = act.dataset.go;
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go && !e.target.closest('a,button:not([data-go]),input,select,label')) location.hash = go.dataset.go;
  else if (go && go.tagName === 'BUTTON') location.hash = go.dataset.go;
});
let typingTimer = null;
function onChange(e) {
  const el = e.target, k = el.dataset.change; if (!k) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  const live = e.type === 'input';
  if (k === 'pf') { ui.people[el.dataset.k] = v; if (live && el.type !== 'number' && el.type !== 'search') return; clearTimeout(typingTimer); typingTimer = setTimeout(() => { const pos = el.selectionStart; rerender(); const n = document.querySelector(`[data-change="pf"][data-k="${el.dataset.k}"]`); if (n && live) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } }, live ? 250 : 0); return; }
  if (k === 'subs-q') { ui.subs.q = v; clearTimeout(typingTimer); typingTimer = setTimeout(() => { rerender(); const n = document.querySelector('[data-change="subs-q"]'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); } }, 250); return; }
  if (live) return;
  if (k === 'session-group') { const s = db.sessions.find(x => x.id === el.dataset.id); const n = Object.keys(s.marks).length;
    if (s.group && n && !confirm(`Перенести занятие ${D.ru(s.date)} из «${s.group}» в «${v || 'без группы'}»? Все ${n} отметок перейдут вместе с ним.`)) { rerender(); return; }
    s.group = v; render.keepScroll = true; persist('Группа занятия изменена'); }
  else if (k === 'subs-sort') { ui.subs.sort = v; ui.subs.dir = v === 'start' ? -1 : 1; rerender(); }
  else if (k === 'jmgroup') { ui.journal.mgroup = v; rerender(); }
  else if (k === 'jmonth-input') { if (v) { ui.journal.month = v; rerender(); } }
  else if (k === 'attest-group') { ui.attest.group = v; rerender(); }
  else if (k === 'test-date') { ui.attest.date = v; rerender(); }
  else if (k === 'rep') { ui.report[el.dataset.k] = v; rerender(); }
  else if (k === 'test-res' || k === 'test-relief' || k === 'test-place' || k === 'test-track') {
    const t = db.tests.find(x => x.id === el.dataset.id);
    if (k === 'test-res') { t.res = t.res || {}; if (v === '') delete t.res[el.dataset.k]; else t.res[el.dataset.k] = Math.round(+v); }
    if (k === 'test-relief') { t.relief = t.relief || {}; t.relief[el.dataset.k] = v; }
    if (k === 'test-place') t.place = v;
    if (k === 'test-track') t.trackManual = v;
    render.keepScroll = true; persist();
  }
  else if (k === 'norm') { const n = db.settings.norms[+el.dataset.i]; const num = !['track', 'sex', 'pullKind', 'pushKind'].includes(el.dataset.k); n[el.dataset.k] = num ? (v === '' ? null : +v) : v.trim(); render.keepScroll = true; persist(); }
  else if (k === 'set') { const numPaths = ['attest.threshold', 'attest.minTournaments', 'attest.reliefCoef', 'defaultCount', 'copiesKeep']; setPath(db.settings, el.dataset.path, numPaths.includes(el.dataset.path) ? +v : v); render.keepScroll = true; persist('Сохранено'); }
  else if (k === 'belts') { db.settings.belts = v.split('\n').map(x => x.trim()).filter(Boolean); render.keepScroll = true; persist('Сохранено'); }
  else if (k === 'tpl') { db.settings.templates[+el.dataset.i][el.dataset.k] = v; render.keepScroll = true; persist('Шаблон сохранён'); }
  else if (k === 'group-name') { const g = db.settings.groups[+el.dataset.i]; const nn = v.trim(); if (!nn) { rerender(); return; }
    if (db.settings.groups.some((x, i) => i !== +el.dataset.i && x.name === nn)) { alert('Группа с таким названием уже есть'); rerender(); return; }
    renameGroup(g.name, nn); g.name = nn; render.keepScroll = true; persist('Группа переименована'); }
  else if (k === 'group-day') { db.settings.groups[+el.dataset.i].days[+el.dataset.d] = v; render.keepScroll = true; persist(); }
}
document.addEventListener('change', onChange);
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-filt]')) ui.peopleFiltOpen = e.target.open; }, true);
document.addEventListener('input', onChange);

/* установка как приложение и работа без интернета — только когда программа открыта как сайт (https) */
if (location.protocol === 'https:' || location.hostname === 'localhost') {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
loadAll(); render();
